    '<div class="judge" id="w-judge" hidden></div>' +
    '<button type="button" class="ghost" id="q-quit">結束考試</button>' +
    (quiz.i === 0 ? '<p class="hint">寫完按「對答案」，跟正確的字比一比，再選自己有沒有寫對。有觸控筆（例如 Apple Pencil）會更好寫。</p>' : "");
  const pad = activePad = makePad($("pad"));
  // 先把手寫範本字體載好，對答案時才畫得出來
  if (document.fonts && document.fonts.load) document.fonts.load("600 80px \"Klee One\"", q.ja).catch(() => {});
  const hint = $("pad-hint");
  const check = $("w-check");
  pad.onChange = () => {
    hint.hidden = pad.strokes.length > 0;
    check.textContent = pad.strokes.length ? "對答案" : "不會寫，看答案";
  };
  pad.onChange();
  $("q-say").onclick = (e) => speak(q.say, e.currentTarget);
  $("w-undo").onclick = () => pad.undo();
  $("w-clear").onclick = () => pad.clear();
  $("q-quit").onclick = showResult;
  check.onclick = () => {
    const empty = pad.strokes.length === 0;
    q._img = empty ? null : pad.snapshot();
    pad.reveal(q.ja);
    if (document.fonts && document.fonts.load) document.fonts.load("600 80px \"Klee One\"", q.ja).then(() => pad.reveal(q.ja)).catch(() => {});
    hint.hidden = true;
    $("w-answer").hidden = false;
    $("w-tools").hidden = true;
    speak(q.say, null);
    const judge = $("w-judge");
    judge.hidden = false;
    const last = quiz.i === quiz.qs.length - 1;
    const next = (right) => {
      (right ? quiz.right : quiz.wrong).push(q);
      activePad = null;
      if (last) return showResult();
      quiz.i++;
      renderQuestion();
      window.scrollTo(0, 0);
    };
    if (empty) {
      judge.innerHTML = '<span class="fb-text">沒關係，記住正確的寫法。</span>' +
        '<button type="button" class="primary" id="w-next">' + (last ? "看成績" : "下一題") + "</button>";
      $("w-next").onclick = () => next(false);
      $("w-next").focus({ preventScroll: true });
    } else {
      judge.innerHTML = '<span class="fb-text">跟正確答案比一比，你寫對了嗎？</span>' +
        '<div class="judge-btns"><button type="button" class="ghost bad-btn" id="w-no">寫錯了</button>' +
        '<button type="button" class="primary ok-btn" id="w-yes">寫對了</button></div>';
      $("w-yes").onclick = () => next(true);
      $("w-no").onclick = () => next(false);
    }
    judge.scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
}

// 成績頁：把自己寫的字和正確答案排在一起
function writeReview() {
  const cards = quiz.wrong.map((q) => [q, false]).concat(quiz.right.map((q) => [q, true]));
  if (!cards.length) return null;
  const grid = document.createElement("div");
  grid.className = "w-review";
  cards.forEach(([q, ok]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "w-card " + (ok ? "ok" : "bad");
    b.innerHTML =
      '<span class="w-mine">' + (q._img ? '<img alt="我寫的「' + esc(q.ja) + '」" src="' + q._img + '">' : '<span class="count">沒有寫</span>') + "</span>" +
      '<span class="w-right"><span class="w-kana">' + esc(q.ja) + '</span><span class="count">' + esc(q.zh) + "</span></span>" +
      '<span class="w-badge">' + (ok ? "寫對" : "寫錯") + "</span>";
    b.setAttribute("aria-label", "播放：" + q.ja);
    b.addEventListener("click", () => speak(q.say, b));
    grid.appendChild(b);
  });
  return grid;
}

// ---- 教學 ----
// 段落文字：保留換行、支援標音、自動標出長音
const richText = (s) => toRuby(s);
// 顯示用：拿掉標音記號，保留原本的空格
const plainJa = (s) => s.replace(/\{([^|}]+)\|[^}]+\}/g, "$1");

function exButton(ex, extraClass) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ex" + (extraClass ? " " + extraClass : "");
  b.innerHTML =
    '<span class="text"><span class="ja' + (ex.ja.includes("\n") ? " long" : "") + '">' + jaHTML(ex.ja) + "</span>" +
    '<span class="zh">' + esc(ex.zh) + "</span></span>" +
    '<span class="play">' + PLAY_ICON + "</span>";
  b.setAttribute("aria-label", "播放：" + toSpeech(ex.ja));
  b.addEventListener("click", () => speak(ex.say || toSpeech(ex.ja), b));
  return b;
}

function guideBlock(bl) {
  const el = document.createElement("div");
  if (bl.t === "p") {
    el.className = "g-p";
    el.innerHTML = richText(bl.text);
  } else if (bl.t === "h") {
    el.innerHTML = '<h3 class="g-h">' + esc(bl.text) + "</h3>";
  } else if (bl.t === "tip") {
    el.className = "g-tip";
    el.innerHTML = '<span class="g-tip-label">小提醒</span><div>' + richText(bl.text) + "</div>";
  } else if (bl.t === "formula") {
    el.className = "formula";
    el.setAttribute("role", "img");
    el.setAttribute("aria-label", "句型：" + bl.parts.map((p) => p.ja).join(" "));
    el.innerHTML = bl.parts.map((p) =>
      '<span class="f-part' + (p.v ? " f-var" : "") + '"><b>' + esc(p.ja) + "</b><small>" + esc(p.zh) + "</small></span>"
    ).join("");
  } else if (bl.t === "break") {
    el.className = "breakdown";
    el.innerHTML = '<div class="bw-row">' + bl.words.map((w) =>
      '<span class="bw"><span class="bw-ja">' + toRuby(w.ja) + '</span><span class="bw-zh">' + esc(w.zh) + "</span></span>"
    ).join("") + "</div>";
    el.appendChild(exButton(bl.full));
  } else if (bl.t === "ex") {
    el.className = "ex-list";
    bl.items.forEach((ex) => el.appendChild(exButton(ex)));
  } else if (bl.t === "pairs") {
    el.className = "pairs";
    bl.items.forEach(([a, b]) => {
      const row = document.createElement("div");
      row.className = "pair-row";
      row.appendChild(exButton(a, "pair"));
      row.appendChild(exButton(b, "pair"));
      el.appendChild(row);
    });
  } else if (bl.t === "rules") {
    el.className = "rules";
    bl.items.forEach((r) => {
      const b = exButton(r, "rule-row");
      b.insertAdjacentHTML("afterbegin", '<span class="rule">' + esc(r.rule) + "</span>");
      el.appendChild(b);
    });
  } else if (bl.t === "quiz") {
    el.className = "panel g-quiz";
    renderGuideQuiz(el, bl.items);
  }
  return el;
}

function renderGuideQuiz(box, items) {
  box.innerHTML = '<div class="panel-head"><h3>小練習</h3><button type="button" class="link">重新作答</button></div>';
  box.querySelector(".link").addEventListener("click", () => renderGuideQuiz(box, items));
  items.forEach((it, qi) => {
    const wrap = document.createElement("div");
    wrap.className = "gq";
    // 聽力題：每次隨機念其中一個
    let options = it.options, answer = it.answer, isJa = it.ja, sayAnswer = null;
    if (it.listen) {
      options = it.listen;
      answer = Math.floor(Math.random() * it.listen.length);
      isJa = true;
      sayAnswer = toSpeech(it.listen[answer].ja);
    }
    wrap.innerHTML = '<p class="gq-q"><span class="gq-n">' + (qi + 1) + "</span>" + esc(it.q) + "</p>";
    if (sayAnswer) {
      const lb = document.createElement("button");
      lb.type = "button";
      lb.className = "pill gq-listen";
      lb.innerHTML = PLAY_ICON + "<span>播放題目</span>";
      lb.addEventListener("click", () => speak(sayAnswer, lb));
      wrap.appendChild(lb);
    }
    const opts = document.createElement("div");
    opts.className = "gq-opts";
    const why = document.createElement("p");
    why.className = "gq-why";
    why.hidden = true;
    const btns = options.map((o, oi) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt" + (isJa ? " ja-opt" : "");
      const ja = typeof o === "string" ? o : o.ja;
      b.innerHTML = isJa
        ? jaHTML(ja) + (typeof o === "object" && o.zh ? '<small class="opt-zh">' + esc(o.zh) + "</small>" : "")
        : esc(o);
      b.addEventListener("click", () => {
        btns.forEach((x) => { x.disabled = true; });
        const right = oi === answer;
        btns[answer].classList.add("right");
        if (!right) b.classList.add("wrong");
        const ans = options[answer];
        why.className = "gq-why " + (right ? "ok" : "bad");
        const ansJa = typeof ans === "string" ? ans : ans.ja;
        why.textContent = (right ? "答對了！" : "答錯了，正確答案是「" + plainJa(ansJa) + "」。") + (it.why ? " " + it.why : "");
        why.hidden = false;
        if (isJa) speak(sayAnswer || toSpeech(ansJa), null);
      });
      opts.appendChild(b);
      return b;
    });
    wrap.appendChild(opts);
    wrap.appendChild(why);
    box.appendChild(wrap);
  });
}

function renderGuide(id) {
  const box = $("guide");
  box.innerHTML = "";
  if (id === "en-shu") { renderEnglish(); return; }
  const idx = GUIDES.findIndex((g) => g.id === id);
  if (idx < 0) {

    box.innerHTML =
      '<div class="unit-head"><div class="title-block"><span class="eyebrow">教學</span><h2>教學</h2></div></div>' +
      '<h3 class="g-group">日文文法・' + GUIDES.length + ' 課</h3>' +
      '<p class="hint">從長音開始，一課一課看下去。每課最後都有小練習。</p>';
    const list = document.createElement("div");
    list.className = "guide-list";
    GUIDES.forEach((g, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "guide-card";
      b.innerHTML = '<span class="g-num">' + (i + 1) + '</span><span class="g-txt"><b>' + esc(g.title) + "</b><small>" + toRuby(g.sub) + "</small></span>" +

      list.appendChild(b);
    });
    box.appendChild(list);
    // 英文口語報告
    const enHead = document.createElement("h3");
    enHead.className = "g-group";
    enHead.textContent = "英文口語報告";
    box.appendChild(enHead);
    const enList = document.createElement("div");
    enList.className = "guide-list";
    const eb = document.createElement("button");
    eb.type = "button";
    eb.className = "guide-card en-card";
    eb.innerHTML = '<span class="g-num">EN</span><span class="g-txt"><b>Zero Waste Shu（我的部分）</b>' +
      "<small>Speaker 1・Slide 1–5・逐句跟讀、重點單字、發音技巧、上台演練</small></span>" +
      '<span class="chev">' + CHEVRON + "</span>";
    eb.addEventListener("click", () => go("guide-en-shu"));
    enList.appendChild(eb);
    box.appendChild(enList);
    return;
  }
  const g = GUIDES[idx];
  const head = document.createElement("div");
  head.className = "g-head";
  head.innerHTML =
    '<button type="button" class="link g-back">‹ 教學目錄</button>' +
    '<span class="eyebrow">教學 ' + (idx + 1) + " / " + GUIDES.length + "</span>" +
    "<h2>" + esc(g.title) + "</h2>" +
    '<p class="g-sub">' + toRuby(g.sub) + "</p>";
  head.querySelector(".g-back").addEventListener("click", () => go("guide"));
  box.appendChild(head);
  g.blocks.forEach((bl) => box.appendChild(guideBlock(bl)));
  const nav = document.createElement("div");
  nav.className = "nav";
  nav.innerHTML =
    '<button type="button" id="g-prev"><small>‹ 上一課</small><span></span></button>' +
    '<button type="button" id="g-next"><small>下一課 ›</small><span></span></button>';
  box.appendChild(nav);
  const prev = GUIDES[idx - 1], next = GUIDES[idx + 1];
  const pb = nav.querySelector("#g-prev"), nb = nav.querySelector("#g-next");
  pb.disabled = !prev; nb.disabled = !next;
  if (prev) { pb.querySelector("span").textContent = prev.title; pb.onclick = () => go("guide-" + prev.id); }
  if (next) { nb.querySelector("span").textContent = next.title; nb.onclick = () => go("guide-" + next.id); }
}

// 英文句子：顯示用 HTML、念的時候分成英文和中文（名字）幾段
function enHTML(s) {
  return esc(s)
    .replace(/\{zh:([^}]+)\}/g, '<span class="en-name" title="用中文念">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g, '<b class="en-st">$1</b>')
    .replace(/‿/g, '<span class="en-link" aria-hidden="true">‿</span>');
}
function enParts(s) {
  const parts = [];
  s.split(/(\{zh:[^}]+\})/).forEach((seg) => {
    if (!seg) return;
    const m = seg.match(/^\{zh:([^}]+)\}$/);
    if (m) parts.push({ t: m[1], lang: "zh" });
    else {
      const t = seg.replace(/\*\*/g, "").replace(/‿/g, " ").trim();
      if (t && /[A-Za-z0-9]/.test(t)) parts.push({ t, lang: "en" });
    }
  });
  return parts;
}
const enPlain = (s) => s.replace(/\{zh:([^}]+)\}/g, "$1").replace(/\*\*/g, "").replace(/‿/g, " ");
// 提示卡：只露出開頭三個字
function enCue(s) {
  const words = enPlain(s).split(/\s+/);
  return esc(words.slice(0, 3).join(" ")) + (words.length > 3 ? " …" : "");
}

// 一句話裡英文、中文名字分段依序念
let partsToken = 0;
function speakParts(parts, el, after, rateOverride) {
  const my = ++partsToken;
  let i = 0;
  const next = () => {
    if (my !== partsToken) return;
    if (i >= parts.length) { if (after) after(); return; }
    const p = parts[i++];
    speak(p.t, el, next, rateOverride, p.lang);
  };
  next();
}
function cancelParts() { partsToken++; if (synth) synth.cancel(); }

// ---- 連續播放（全文／跟讀）----
let enAuto = null; // { rows, i, paused, shadow, timer }
function enShadowMs(row) {
  const words = enPlain(row._line.en).split(/\s+/).length;
  return Math.max(1800, words * 520 / (rate || 0.9) + 800);
}
function enUpdate() {
  const play = $("en-play"), shadow = $("en-shadow"), stop = $("en-stop"), status = $("en-status");
  if (!play) return;
  const st = !enAuto ? "idle" : enAuto.paused ? "paused" : "playing";
  const pos = enAuto ? Math.min(enAuto.i + 1, enAuto.rows.length) + "/" + enAuto.rows.length : "";
  const label = (btn, isShadow, idleText) => {
    const mine = enAuto && enAuto.shadow === isShadow;
    btn.setAttribute("aria-pressed", String(!!mine && st === "playing"));
    btn.querySelector("span").textContent = !mine ? idleText : st === "playing" ? "暫停 " + pos : "繼續 " + pos;
    btn.querySelector("svg").innerHTML = mine && st === "playing" ? ICON_PAUSE : ICON_PLAY;
  };
  label(play, false, "全文播放");
  label(shadow, true, "跟讀模式");
  stop.hidden = st === "idle";
  status.textContent = !enAuto ? "" : enAuto.shadow
    ? (st === "paused" ? "已暫停" : "聽一句，換你跟著念一句")
    : (st === "paused" ? "已暫停" : "播放中");
}
function enClearTurn() { document.querySelectorAll(".en-row.your-turn").forEach((r) => r.classList.remove("your-turn")); }
function enStop() {
  if (!enAuto) return;
  clearTimeout(enAuto.timer);
  enAuto = null;
  cancelParts();
  enClearTurn();
  enUpdate();
}
function enStep(ap) {
  if (enAuto !== ap || ap.paused) return;
  if (ap.i >= ap.rows.length) { enStop(); return; }
  const row = ap.rows[ap.i];
  enUpdate();
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  row.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
  speakParts(row._parts, row, () => {
    if (enAuto !== ap || ap.paused) return;
    if (ap.shadow) {
      row.classList.add("your-turn");
      ap.timer = setTimeout(() => { row.classList.remove("your-turn"); ap.i++; enStep(ap); }, enShadowMs(row));
    } else {
      ap.i++;
      ap.timer = setTimeout(() => enStep(ap), 350);
    }
  });
}
function enStart(shadow) {
  if (enAuto && enAuto.shadow === shadow) {
    if (enAuto.paused) { enAuto.paused = false; enStep(enAuto); }
    else { enAuto.paused = true; clearTimeout(enAuto.timer); cancelParts(); enClearTurn(); enUpdate(); }
    return;
  }
  enStop();
  const rows = Array.from(document.querySelectorAll("#en-script .en-row"));
  if (!rows.length) return;
  enAuto = { rows, i: 0, paused: false, shadow, timer: null };
  stopAll();
  enStep(enAuto);
}

// ---- 計時 ----
const enTimer = { start: 0, elapsed: 0, iv: null };
const fmtTime = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function enTimerPaint() {
  const el = $("en-time");
  if (!el) return;
  const ms = enTimer.elapsed + (enTimer.iv ? Date.now() - enTimer.start : 0);
  el.textContent = fmtTime(ms);
  el.dataset.state = ms > 180000 ? "over" : ms > 165000 ? "near" : "ok";
  $("en-timer-btn").textContent = enTimer.iv ? "暫停計時" : ms ? "繼續計時" : "開始計時";
}
function enTimerToggle() {
  if (enTimer.iv) { enTimer.elapsed += Date.now() - enTimer.start; clearInterval(enTimer.iv); enTimer.iv = null; }
  else { enTimer.start = Date.now(); enTimer.iv = setInterval(enTimerPaint, 250); }
  enTimerPaint();
}
function enTimerPause() {
  if (!enTimer.iv) return;
  enTimer.elapsed += Date.now() - enTimer.start;
  clearInterval(enTimer.iv);
  enTimer.iv = null;
}

        '<button type="button" class="link" id="en-timer-reset">重設</button></div>';
    box.appendChild(ctl);
    $("en-play").onclick = () => enStart(false);
    $("en-shadow").onclick = () => enStart(true);
    $("en-stop").onclick = enStop;
    $("en-timer-btn").onclick = enTimerToggle;
    $("en-timer-reset").onclick = () => { enTimerPause(); enTimer.elapsed = 0; enTimerPaint(); };
    enTimerPaint();
    if (enTimer.iv) { clearInterval(enTimer.iv); enTimer.iv = setInterval(enTimerPaint, 250); }
    box.appendChild(enModeBar());
    box.appendChild(enScript(false));
    const tips = document.createElement("section");
    tips.className = "panel";
    tips.innerHTML = "<h3>上台小提醒</h3><ul class=\"en-checklist\">" + EN_SHU.stage.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>";
    box.appendChild(tips);
    enUpdate();
  } else if (enTab === "fix") {
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "這幾個地方我在練習稿裡已經改好了。投影片上如果也有這些句子，記得跟組員說一聲。";
    box.appendChild(hint);
    EN_SHU.fixes.forEach((f) => {
      const sec = document.createElement("section");
      sec.className = "panel en-fixcard";
      sec.innerHTML =
        '<div class="en-from"><span class="tag-bad">原稿</span>' + esc(f.from) + "</div>" +
        '<div class="en-to"><span class="tag-ok">建議</span>' + esc(f.to) + "</div>" +
        '<p class="hint">' + esc(f.why) + "</p>";
      box.appendChild(sec);
    });
  }
}

// ---- 切換畫面 ----
function render(hash) {
  closeDetail();
  stopAll();
  enStop();
  enTimerPause();
  if (synth) synth.cancel();
  quiz.token = null;
  const isQuiz = hash === "quiz";
  const isGuide = hash === "guide" || hash.startsWith("guide-");
  const isLearn = !isQuiz && !isGuide;
  $("learn").hidden = !isLearn;
  $("quiz").hidden = !isQuiz;
  $("guide").hidden = !isGuide;
  $("unit").hidden = !isLearn;
  $("tab-learn").setAttribute("aria-pressed", String(isLearn));
  $("tab-quiz").setAttribute("aria-pressed", String(isQuiz));
  $("tab-guide").setAttribute("aria-pressed", String(isGuide));
  if (isQuiz) { renderSetup(); return; }
  if (isGuide) { renderGuide(hash.replace(/^guide-?/, "")); return; }
  let idx = UNITS.findIndex((u) => u.id === hash);
  if (idx < 0) idx = Math.max(0, UNITS.findIndex((u) => u.id === store.get("unit")));
  renderUnit(idx);
}
function go(id) {
  if (location.hash.slice(1) === id) render(id);
  else location.hash = id;
  window.scrollTo(0, 0);
}
$("unit").addEventListener("change", (e) => go(e.target.value));
$("tab-learn").addEventListener("click", () => go(store.get("unit") || UNITS[0].id));
$("tab-quiz").addEventListener("click", () => go("quiz"));
$("tab-guide").addEventListener("click", () => go("guide"));
window.addEventListener("hashchange", () => render(location.hash.slice(1)));
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("detail").hidden) {
    if (e.key === "Escape") { e.preventDefault(); closeDetail(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); navDetail(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); navDetail(1); }
    return;
  }
  if ($("quiz").hidden) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select") return;
  const opt = document.querySelector('.opt[data-n="' + e.key + '"]');
  if (opt && !opt.disabled) { e.preventDefault(); opt.click(); return; }
  if (e.key === "Enter" && $("w-check") && !$("w-tools").hidden && tag !== "button") { e.preventDefault(); $("w-check").click(); return; }
  if (e.key === "Enter" && $("w-next")) { e.preventDefault(); $("w-next").click(); return; }
  if (e.key === "Enter" && $("q-next")) { e.preventDefault(); $("q-next").click(); return; }
  if (e.key === " " && $("q-say") && tag !== "button") { e.preventDefault(); $("q-say").click(); }
});

// 語速
function setRate(r) {
  rate = r;
  store.set("rate", String(r));
  document.querySelectorAll(".speed button").forEach((b) => {
    b.setAttribute("aria-pressed", String(parseFloat(b.dataset.rate) === r));
  });
}
document.querySelectorAll(".speed button").forEach((b) => {
  b.addEventListener("click", () => setRate(parseFloat(b.dataset.rate)));
});
setRate(rate);

render(location.hash.slice(1));
startSync();
</script>
<!--BODY-END-->
