<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>日文聽讀本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Klee+One:wght@600&display=swap">
<style>
/* 版面：單欄講義，上方固定「單元選單」，每一行點一下就念出來 */
:root {
  --paper: #eef1f6;
  --sheet: #ffffff;
  --ink: #1b2232;
  --muted: #5d6779;
  --line: #dde2ec;
  --ai: #2c4a8a;          /* 藍染色：主色 */
  --ai-soft: #e3e9f6;
  --pencil: #6f6a5f;      /* 鉛筆色：手寫補充 */
  --pencil-soft: #efece4;
  --cho-line: #93a8db;    /* 長音底線 */
  --ok: #1d7a4c;
  --ok-soft: #e1f2e8;
  --bad: #b3261e;
  --bad-soft: #fbe6e3;
  --lv0: #c2410c; --lv0-soft: #fdeadf;   /* 不熟 */
  --lv1: #9a6a00; --lv1-soft: #fbf0d3;   /* 普通 */
  --lv2: #1d7a4c; --lv2-soft: #e1f2e8;   /* 熟練 */
  --font-ja: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-hand: "Klee One", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;  /* 手寫範本用的教科書風字體 */
  --font-zh: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141c; --sheet: #181e2a; --ink: #e5e9f1; --muted: #9aa4b7; --line: #283043;
    --ai: #94adea; --ai-soft: #222f4d; --pencil: #c2bba9; --pencil-soft: #2a2924; --cho-line: #5a72b0;
    --ok: #6fd3a0; --ok-soft: #173528; --bad: #f2948a; --bad-soft: #3d1f1c;
    --lv0: #fb9a6c; --lv0-soft: #3a2216; --lv1: #e8c35a; --lv1-soft: #352c14; --lv2: #6fd3a0; --lv2-soft: #173528;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141c; --sheet: #181e2a; --ink: #e5e9f1; --muted: #9aa4b7; --line: #283043;
  --ai: #94adea; --ai-soft: #222f4d; --pencil: #c2bba9; --pencil-soft: #2a2924; --cho-line: #5a72b0;
  --ok: #6fd3a0; --ok-soft: #173528; --bad: #f2948a; --bad-soft: #3d1f1c;
    --lv0: #fb9a6c; --lv0-soft: #3a2216; --lv1: #e8c35a; --lv1-soft: #352c14; --lv2: #6fd3a0; --lv2-soft: #173528;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-zh);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet);
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 上方選單 */
header {
  box-shadow: 0 1px 0 var(--line), 0 6px 16px -12px rgba(20, 30, 60, .25);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--sheet);
  border-bottom: 1px solid var(--line);
}
header .wrap { padding-block: 12px; display: grid; gap: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-ja); font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; }
h1 .accent { color: var(--ai); margin-left: -8px; }
.seal {
  display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
  background: var(--ai); color: var(--sheet); font-size: 1rem; letter-spacing: 0;
}
.top-tools { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer;
  background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 50%;
}
.icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
.icon-btn[aria-expanded="true"] { color: var(--ai); border-color: var(--ai); background: var(--ai-soft); }
.settings { display: grid; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--line); }
.set-label { font-size: .9rem; font-weight: 700; padding-top: 8px; }
.set-row { display: flex; gap: 8px; }
.set-row select { flex: 1; min-width: 0; }
.small-btn { padding: 8px 16px; font-size: .9rem; }
.settings .hint { line-height: 1.7; }
.speed { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex-shrink: 0; }
.speed button {
  border: 0; background: none; color: var(--muted); font: inherit; font-size: .85rem;
  padding: 4px 12px; border-radius: 999px; cursor: pointer;
}
.speed button[aria-pressed="true"] { background: var(--ai); color: var(--sheet); }
.bar-row { display: flex; gap: 10px; align-items: center; }
.bar-row select { flex: 1; min-width: 0; }
.tabs, .seg { display: flex; flex-wrap: wrap; gap: 6px; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.tabs { flex-shrink: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button, .seg button {
  font: inherit; font-size: .95rem; cursor: pointer; color: var(--muted);
  background: none; border: 0; border-radius: 8px; padding: 7px 14px;
}
.tabs button { padding: 7px 11px; }
.tabs button[aria-pressed="true"] { background: var(--sheet); color: var(--ai); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
select {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}

/* 單元內容 */
main .wrap { padding-block: 20px 40px; display: grid; gap: 14px; }
.unit-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.unit-head .pill { flex-shrink: 0; }
h2 { margin: 0; font-family: var(--font-ja); font-size: 1.4rem; text-wrap: balance; }
.count { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.list { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px;
  border-top: 1px solid var(--line); padding-right: 12px;
}
.side { display: grid; gap: 6px; justify-items: stretch; }
.more {
  display: inline-flex; align-items: center; justify-content: center; gap: 1px; cursor: pointer;
  font: inherit; font-size: .76rem; font-weight: 700; color: var(--ai);
  background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 10px;
}
.more svg { width: 14px; height: 14px; }
.lv { justify-content: center; }
.item:first-child { border-top: 0; }
.item.playing { background: var(--ai-soft); }
.item.faded { opacity: .45; }
.item-main {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
  min-width: 0; width: 100%; text-align: left; font: inherit; color: inherit;
  background: none; border: 0; padding: 14px 8px 14px 16px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.item-main:focus-visible { outline: 2px solid var(--ai); outline-offset: -2px; border-radius: 8px; }
.chev { display: grid; color: var(--muted); opacity: .55; }
.chev svg { width: 18px; height: 18px; }

.lv {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer;
  font: inherit; font-size: .74rem; font-weight: 700; letter-spacing: .04em;
  border: 0; border-radius: 999px; padding: 5px 9px;
}
.lv::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.lv.lv0 { color: var(--lv0); background: var(--lv0-soft); }
.lv.lv1 { color: var(--lv1); background: var(--lv1-soft); }
.lv.lv2 { color: var(--lv2); background: var(--lv2-soft); }
.empty { margin: 0; padding: 28px 18px; text-align: center; color: var(--muted); font-size: .92rem; }
.text { min-width: 0; display: grid; gap: 2px; }
.ja { font-family: var(--font-ja); font-size: 1.3rem; line-height: 1.9; line-break: strict; }
.ja.long { font-size: 1.1rem; }
@media (min-width: 600px) { .ja.long { font-size: 1.25rem; } }
.ja .line { display: block; }
.ja rt { font-size: .5em; color: var(--muted); letter-spacing: .02em; }
.kanji { font-family: var(--font-ja); color: var(--muted); font-size: .95rem; }
.zh { color: var(--muted); font-size: .95rem; white-space: pre-line; }
.tag {
  display: inline-block; font-size: .72rem; letter-spacing: .06em; color: var(--pencil);
  background: var(--pencil-soft); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px;
}
.note { color: var(--pencil); font-size: .82rem; }
.play {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ai-soft); color: var(--ai); flex-shrink: 0;
  border: 0; padding: 0; cursor: pointer;
}
.play svg { width: 18px; height: 18px; fill: currentColor; }
.item.playing .play { background: var(--ai); color: var(--sheet); }

/* 五十音表 */
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.cell {
  display: grid; place-items: center; gap: 0; aspect-ratio: 1 / 1; max-width: 100%;
  font: inherit; color: inherit; cursor: pointer; padding: 4px;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 12px;
  -webkit-tap-highlight-color: transparent;
}
.cell:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.cell.playing { background: var(--ai); color: var(--sheet); border-color: var(--ai); }
.cell .k { font-family: var(--font-ja); font-size: clamp(1.6rem, 7vw, 2.4rem); line-height: 1.1; }
.cell .r { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.cell.playing .r { color: inherit; }
.gap { aspect-ratio: 1 / 1; }
.kana { display: grid; gap: 12px; }
.kana h3 { margin: 10px 0 0; font-size: 1rem; color: var(--muted); font-weight: 700; }
.kana h3:first-child { margin-top: 0; }
.grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.g3 .cell { aspect-ratio: auto; padding-block: 10px; }
.grid.gn { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gn .cell { aspect-ratio: auto; grid-template-columns: 2.6em 1fr; justify-items: start; gap: 8px; padding: 10px 12px; }
.gn .cell .k { font-family: var(--font-zh); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.gn .cell .r { font-family: var(--font-ja); font-size: .95rem; color: var(--ink); letter-spacing: 0; }
@media (min-width: 600px) {
  .grid.gn { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
  .gn .cell { grid-template-columns: none; justify-items: center; gap: 2px; padding-inline: 4px; }
  .gn .cell .r { font-size: .82rem; white-space: nowrap; }
}

/* 考試 */
.view { display: grid; gap: 14px; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.panel h3, .sub-h { margin: 0; font-size: 1rem; }
.sub-h { color: var(--muted); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.links { display: flex; gap: 4px; }
.link { font: inherit; font-size: .9rem; color: var(--ai); background: none; border: 0; padding: 4px 8px; cursor: pointer; }
.checks { display: grid; gap: 2px; }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 4px; cursor: pointer; border-radius: 8px; }
.check input { width: 20px; height: 20px; accent-color: var(--ai); margin: 0; flex-shrink: 0; }
.check-name { flex: 1; min-width: 0; }
.seg button { border: 1px solid var(--line); background: var(--paper); }
.seg button[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: var(--sheet); }
.primary {
  font: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer;
  color: var(--sheet); background: var(--ai); border: 0; border-radius: 12px; padding: 13px 20px;
}
.primary:disabled { opacity: .45; cursor: default; }
.ghost {
  font: inherit; font-size: .95rem; cursor: pointer; color: var(--muted);
  background: none; border: 1px solid var(--line); border-radius: 12px; padding: 11px 18px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > * { flex: 1 1 160px; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ai); border-radius: 99px; }
.prompt {
  background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 22px 16px;
  display: grid; justify-items: center; gap: 8px; text-align: center;
}
.ask { color: var(--muted); font-size: .9rem; }
.q-ja { font-family: var(--font-ja); font-size: 2.2rem; line-height: 1.7; }
.q-ja.long { font-size: 1.2rem; text-align: left; }
.q-ja .line { display: block; }
.q-ja rt { font-size: .45em; color: var(--muted); }
.q-zh { font-size: 1.5rem; white-space: pre-line; text-wrap: balance; }
.mini-play, .big-play {
  display: grid; place-items: center; border: 0; cursor: pointer; border-radius: 50%;
  background: var(--ai-soft); color: var(--ai);
}
.mini-play { width: 40px; height: 40px; }
.mini-play svg { width: 18px; height: 18px; fill: currentColor; }
.big-play { width: 88px; height: 88px; }
.big-play svg { width: 38px; height: 38px; fill: currentColor; }
.mini-play.playing, .big-play.playing { background: var(--ai); color: var(--sheet); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.opt {
  font: inherit; font-size: 1.05rem; color: var(--ink); text-align: left; cursor: pointer;
  background: var(--sheet); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px;
  white-space: pre-line; min-width: 0;
}
.opt.ja-opt { font-family: var(--font-ja); font-size: 1.2rem; white-space: normal; line-height: 1.8; }
.opt.ja-opt .line { display: block; }
.opt rt { font-size: .5em; color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-radius: 12px; padding: 12px 14px; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.fb-text { font-weight: 700; }
.score { font-size: 3.2rem; font-weight: 700; color: var(--ai); font-variant-numeric: tabular-nums; line-height: 1.1; }
.score small { font-size: 1.4rem; color: var(--muted); font-weight: 400; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
.nav button {
  display: grid; gap: 2px; font: inherit; color: var(--ink); cursor: pointer; text-align: left;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0;
}
.nav button small { color: var(--ai); font-size: .8rem; }
.nav button span { font-family: var(--font-ja); font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav button:last-child { text-align: right; grid-column: 2; }
.nav button:disabled { visibility: hidden; }
.title-block { display: grid; gap: 2px; min-width: 0; }
.eyebrow { font-size: .75rem; letter-spacing: .12em; color: var(--ai); font-weight: 700; }
.tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .88rem; color: var(--muted); user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.switch .track {
  position: relative; width: 38px; height: 22px; border-radius: 999px; flex-shrink: 0;
  background: var(--line); transition: background .2s;
}
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s;
}
.switch input:checked + .track { background: var(--pencil); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:checked ~ span:last-child { color: var(--ink); }
.switch input:focus-visible + .track { outline: 2px solid var(--ai); outline-offset: 2px; }
#list[data-extra="off"] .item.extra { display: none; }
.extra-check { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 12px; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .88rem; cursor: pointer;
  color: var(--ai); background: var(--ai-soft); border: 0; border-radius: 999px; padding: 7px 14px 7px 10px;
}
.pill svg { width: 16px; height: 16px; fill: currentColor; }
.pill[aria-pressed="true"] { background: var(--ai); color: var(--sheet); }
.tip { color: var(--muted); font-size: .8rem; text-align: center; margin: 0; }
.warn { background: var(--pencil-soft); color: var(--pencil); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }
@media (hover: hover) {
  .item:hover { background: var(--paper); }
  .cell:hover { border-color: var(--ai); }
  .check:hover { background: var(--paper); }
  .opt:not(:disabled):hover { border-color: var(--ai); }
  .nav button:hover { border-color: var(--ai); }
}
.item.playing:hover { background: var(--ai-soft); }

/* 日文換行：在空格處換行，一個詞放不下才從中間斷 */
.ja, .d-ja, .q-ja, .opt.ja-opt, .bw-ja { word-break: keep-all; overflow-wrap: anywhere; }

/* 手寫五十音 */
.w-prompt { gap: 6px; padding-block: 16px; }
.q-roma { font-size: 2.8rem; font-weight: 700; letter-spacing: .06em; color: var(--ai); line-height: 1.1; }
.write-area { display: grid; gap: 12px; justify-items: center; }
@media (min-width: 600px) { .write-area { grid-template-columns: auto auto; justify-content: center; align-items: center; } }
.pad-wrap { position: relative; width: min(100%, 340px); aspect-ratio: 1 / 1; }
#pad {
  display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair;
  background: var(--sheet); border: 2px solid var(--line); border-radius: 16px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.pad-hint { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); opacity: .6; pointer-events: none; }
.answer-box {
  display: grid; justify-items: center; gap: 2px; min-width: 140px;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 12px 24px;
}
.w-kana { font-family: var(--font-hand); font-weight: 600; font-size: 4.2rem; line-height: 1.15; color: var(--ai); }
.w-tools { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px; }
.w-tools button { padding-inline: 8px; }
.judge { display: grid; gap: 10px; background: var(--ai-soft); border-radius: 12px; padding: 12px 14px; }
.judge .fb-text { color: var(--ink); }
.judge-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bad-btn { color: var(--bad); border-color: var(--bad); background: var(--sheet); }
.primary.ok-btn { background: var(--ok); }
.w-review { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.w-card {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; text-align: center;
  font: inherit; color: inherit; cursor: pointer;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 10px;
}
.w-card.bad { border-color: var(--bad); }
.w-mine { display: grid; place-items: center; aspect-ratio: 1 / 1; border: 1px dashed var(--line); border-radius: 10px; overflow: hidden; }
.w-mine img { width: 100%; height: 100%; display: block; }
.w-right { display: grid; justify-items: center; }
.w-right .w-kana { font-size: 2.4rem; }
.w-badge { grid-column: 1 / -1; justify-self: center; font-size: .76rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.w-card.ok .w-badge { background: var(--ok-soft); color: var(--ok); }
.w-card.bad .w-badge { background: var(--bad-soft); color: var(--bad); }

/* 教學 */
.guide-list { display: grid; gap: 10px; }
.guide-card {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
}
.g-num {
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
  background: var(--ai-soft); color: var(--ai); font-weight: 700; font-variant-numeric: tabular-nums;
}
.g-txt { display: grid; gap: 2px; min-width: 0; }
.g-txt b { font-size: 1.05rem; }
.g-txt small { color: var(--muted); font-family: var(--font-ja); font-size: .88rem; }
.g-head { display: grid; gap: 4px; justify-items: start; }
.g-head h2 { margin: 0; }
.g-back { padding: 0 0 6px; }
.g-sub { margin: 0; color: var(--muted); font-family: var(--font-ja); }
.g-h { margin: 10px 0 0; font-size: 1.1rem; }
.g-p { margin: 0; white-space: pre-line; line-height: 1.9; max-width: 40em; }
.g-p, .g-tip div { font-size: 1rem; }
.g-p .cho, .g-tip .cho { font-family: var(--font-ja); }
.g-tip {
  display: grid; gap: 4px; background: var(--pencil-soft); color: var(--ink);
  border-radius: 12px; padding: 12px 14px; white-space: pre-line; line-height: 1.85;
}
.g-tip-label { font-size: .78rem; font-weight: 700; letter-spacing: .08em; color: var(--pencil); }
.formula { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.formula { gap: 6px; }
.f-part {
  display: grid; gap: 2px; justify-items: center; text-align: center;
  background: var(--ai); color: var(--sheet); border-radius: 12px; padding: 8px 9px; min-width: 56px;
}
.f-part b { font-family: var(--font-ja); font-size: 1.2rem; font-weight: 700; }
.f-part small { font-size: .7rem; opacity: .9; white-space: nowrap; }
@media (min-width: 600px) {
  .formula { gap: 8px; }
  .f-part { padding: 10px 14px; min-width: 64px; }
  .f-part b { font-size: 1.3rem; }
  .f-part small { font-size: .76rem; }
}
.f-part.f-var { background: var(--sheet); color: var(--ai); border: 2px dashed var(--ai); }
.f-part.f-var small { color: var(--muted); opacity: 1; }
.breakdown { display: grid; gap: 10px; }
.bw-row { display: flex; flex-wrap: wrap; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.bw { display: grid; justify-items: center; gap: 2px; padding: 10px 14px; border-right: 1px dashed var(--line); }
.bw:last-child { border-right: 0; }
.bw-ja { font-family: var(--font-ja); font-size: 1.3rem; line-height: 1.8; }
.bw-ja rt { font-size: .45em; color: var(--muted); }
.bw-zh { font-size: .82rem; color: var(--muted); }
.pairs { display: grid; gap: 8px; }
.pair-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ex.pair { background: var(--sheet); border: 1px solid var(--line); }
.ex.pair { padding: 12px; gap: 8px; }
.ex.pair .ja { font-size: 1.15rem; }
.ex.pair .play { width: 30px; height: 30px; }
@media (max-width: 480px) { .ex.pair .ja { font-size: .98rem; } }
.rules { display: grid; gap: 6px; }
.ex.rule-row { grid-template-columns: 6.6em minmax(0, 1fr) auto; background: var(--sheet); border: 1px solid var(--line); }
.rule { font-size: .85rem; font-weight: 700; color: var(--ai); }
.g-quiz { gap: 16px; }
.gq { display: grid; gap: 8px; }
.gq + .gq { border-top: 1px dashed var(--line); padding-top: 14px; }
.gq-q { margin: 0; display: flex; gap: 8px; align-items: baseline; font-weight: 700; }
.gq-n {
  display: inline-grid; place-items: center; flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
  background: var(--ai-soft); color: var(--ai); font-size: .8rem;
}
.gq-listen { justify-self: start; }
.gq-opts { display: grid; gap: 8px; }
.gq-opts .opt { padding: 11px 14px; }
.opt-zh { display: block; font-family: var(--font-zh); font-size: .8rem; color: var(--muted); }
.gq-why { margin: 0; font-size: .9rem; border-radius: 10px; padding: 8px 12px; }
.gq-why.ok { background: var(--ok-soft); color: var(--ok); }
.gq-why.bad { background: var(--bad-soft); color: var(--bad); }

/* 熟練度篩選 */
.sync { order: 9; flex-basis: 100%; display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
.sync:empty { display: none; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
.sync[data-state="saved"]::before { background: var(--ok); }
.sync[data-state="saving"]::before, .sync[data-state="loading"]::before { background: var(--ai); }
.sync[data-state="offline"]::before { background: var(--lv1); }
.lvbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lvbar-label { font-size: .85rem; color: var(--muted); }
.lv-filter { display: flex; flex-wrap: wrap; gap: 6px; }
.lvchip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  font: inherit; font-size: .86rem; color: var(--muted);
  background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
}
.lvchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--lvc); opacity: .5; }
.lvchip b { font-weight: 700; font-variant-numeric: tabular-nums; }
.lvchip[aria-pressed="true"] { color: var(--lvc); background: var(--lvc-soft); border-color: var(--lvc); }
.lvchip[aria-pressed="true"] i { opacity: 1; }
.lv0 { --lvc: var(--lv0); --lvc-soft: var(--lv0-soft); }
.lv1 { --lvc: var(--lv1); --lvc-soft: var(--lv1-soft); }
.lv2 { --lvc: var(--lv2); --lvc-soft: var(--lv2-soft); }

/* 詳細頁 */
html.sheet-open, html.sheet-open body { overflow: hidden; }
.sheet {
  position: fixed; inset: 0; z-index: 20; background: var(--paper);
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
}
.sheet-bar {
  position: sticky; top: 0; z-index: 1; background: var(--sheet);
  border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px);
}
.sheet-bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.d-nav { display: flex; gap: 8px; }
.d-nav .icon-btn:disabled { opacity: .35; cursor: default; }
.sheet-body { padding-block: 18px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.d-hero {
  background: var(--sheet); border: 1px solid var(--line); border-radius: 16px;
  padding: 22px 18px; display: grid; gap: 6px; justify-items: start;
}
.d-ja { margin: 0; font-family: var(--font-ja); font-size: 2.1rem; font-weight: 400; line-height: 1.7; line-break: strict; }
.d-ja.long { font-size: 1.3rem; }
.d-ja .line { display: block; }
.d-ja rt { font-size: .45em; color: var(--muted); }
.d-kanji { font-family: var(--font-ja); color: var(--muted); font-size: 1.05rem; }
.d-zh { font-size: 1.1rem; white-space: pre-line; }
.d-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.d-play { display: inline-flex; align-items: center; gap: 8px; }
.d-play svg { width: 18px; height: 18px; fill: currentColor; }
.d-play.playing { outline: 3px solid var(--ai-soft); }
.d-info { margin: 0; white-space: pre-line; line-height: 1.85; }
.lvseg button { display: inline-flex; align-items: center; gap: 6px; }
.lvseg button i { width: 8px; height: 8px; border-radius: 50%; background: var(--lvc); }
.lvseg button[aria-pressed="true"] { background: var(--lvc); border-color: var(--lvc); color: var(--sheet); }
.lvseg button[aria-pressed="true"] i { background: var(--sheet); }
.ex-list { display: grid; gap: 8px; }
.ex {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--paper); border: 0; border-radius: 12px; padding: 12px 14px;
}
.ex .ja { font-size: 1.12rem; line-height: 1.85; }
.ex .ja.long { font-size: 1.05rem; }
.ex.playing { background: var(--ai-soft); }
.ex .play { width: 34px; height: 34px; }
.ex.playing .play { background: var(--ai); color: var(--sheet); }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 30; max-width: calc(100% - 32px); background: var(--ink); color: var(--sheet);
  padding: 10px 18px; border-radius: 999px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.2);
}

/* 顯示模式：中日／只看中文／只看日文 */
.modebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.seg.small button { font-size: .88rem; padding: 6px 12px; }
.ph { display: none; justify-self: start; color: var(--ai); font-size: .88rem; border: 1px dashed var(--ai); border-radius: 8px; padding: 4px 10px; }
#list[data-mode="zh"] .item.masked .ja-part,
#list[data-mode="ja"] .item.masked .zh-part { display: none; }
#list[data-mode="zh"] .item.masked .ph-ja,
#list[data-mode="ja"] .item.masked .ph-zh { display: block; }
#list[data-mode="zh"] .cell.masked .ja-part,
#list[data-mode="ja"] .cell.masked .zh-part { color: transparent; background: var(--line); border-radius: 6px; }
#list[data-mode="zh"] .cell.masked .ja-part rt { color: transparent; }
.cell .ja-part, .cell .zh-part { min-width: 2.4em; text-align: center; }

/* 長音：整個長音底下一條線，負責拉長的那個假名用主色 */
.cho {
  text-decoration-line: underline;
  text-decoration-color: var(--cho-line);
  text-decoration-thickness: 2px;
  text-underline-offset: .3em;
  text-decoration-skip-ink: none;
}
.cho b { font-weight: inherit; color: var(--ai); }
rt .cho { text-decoration: none; }
#list[data-mode="zh"] .cell.masked .ja-part .cho,
#list[data-mode="ja"] .cell.masked .zh-part .cho { text-decoration-color: transparent; }
#list[data-mode="zh"] .cell.masked .ja-part .cho b,
#list[data-mode="ja"] .cell.masked .zh-part .cho b { color: transparent; }
.legend { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.legend .eg { font-family: var(--font-ja); font-size: 1.05rem; color: var(--ink); }
button, label, select { touch-action: manipulation; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }
kbd { font: inherit; font-size: .8em; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
@media (prefers-reduced-motion: no-preference) {
  .item, .cell, .opt, .ex { transition: background .15s, border-color .15s, transform .1s, opacity .2s; }
  .cell:active, .opt:not(:disabled):active, .ex:active { transform: scale(.985); }
  .lv:active, .lvchip:active, .more:active { transform: scale(.92); }
  .item-main:active .play { transform: scale(.9); }
  .sheet:not([hidden]) { animation: sheet-in .22s ease-out; }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .playing .play svg, .playing.big-play svg, .playing.mini-play svg { animation: pulse .7s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.18); } }
  .ja-part, .zh-part { transition: color .2s, background .2s; }
}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<header>
  <div class="wrap">
    <div class="top">
      <h1><span class="seal" aria-hidden="true">あ</span>日文<span class="accent">聽讀本</span></h1>
      <div class="top-tools">
        <div class="speed" role="group" aria-label="語速">
          <button type="button" id="spd-normal" data-rate="0.9" aria-pressed="true">正常</button>
          <button type="button" id="spd-slow" data-rate="0.6" aria-pressed="false">慢速</button>
        </div>
        <button type="button" class="icon-btn" id="settings-btn" aria-expanded="false" aria-controls="settings" aria-label="語音設定">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </div>
    <div class="bar-row">
      <div class="tabs" role="group" aria-label="模式">
        <button type="button" id="tab-learn" aria-pressed="true">學習</button>
        <button type="button" id="tab-quiz" aria-pressed="false">考試</button>
        <button type="button" id="tab-guide" aria-pressed="false">教學</button>
      </div>
      <label for="unit" hidden>選擇單元</label>
      <select id="unit"></select>
    </div>
    <section class="settings" id="settings" hidden>
      <label for="voice" class="set-label">日文語音</label>
      <div class="set-row">
        <select id="voice"></select>
        <button type="button" class="ghost small-btn" id="voice-test">試聽</button>
      </div>
      <p class="hint">發音聽起來怪怪的，可以換一個語音試試。<br>
        iPhone／iPad：設定 → 輔助使用 → 朗讀內容 → 聲音 → 日文，下載「加強版」或「高品質」語音，重新打開網頁就會自然很多。<br>
        Android：安裝「Google 文字轉語音」並下載日文語音。</p>
      <p class="hint">在 claude.ai 裡打開時，熟練度會存到你的帳號，換裝置或重新登入都還在，而且只有你自己看得到。</p>
    </section>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="warn" id="warn" hidden></p>
    <div class="view" id="learn">
    <div class="unit-head">
      <div class="title-block">
        <span class="eyebrow" id="unit-eyebrow"></span>
        <h2 id="unit-title"></h2>
      </div>
      <span class="count" id="unit-count" hidden></span>
      <button type="button" class="pill" id="play-all" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l11-7z"/></svg><span>全部播放</span></button>
    </div>
    <div class="modebar">
      <div class="seg small" id="mode" role="group" aria-label="顯示模式">
        <button type="button" id="mode-both" data-mode="both">中日對照</button>
        <button type="button" id="mode-zh" data-mode="zh">只看中文</button>
        <button type="button" id="mode-ja" data-mode="ja">只看日文</button>
      </div>
      <div class="tools">
        <button type="button" class="link" id="reveal-all" hidden>全部翻開</button>
        <label class="switch" id="extra-switch" for="show-extra">
          <input type="checkbox" id="show-extra" role="switch">
          <span class="track" aria-hidden="true"></span>
          <span>顯示補充</span>
        </label>
      </div>
    </div>
    <div class="lvbar" id="lvbar" hidden><span class="lvbar-label">熟練度</span><span class="sync" id="sync-status" role="status"></span></div>
    <p class="hint" id="mode-hint" hidden></p>
    <p class="hint legend" id="cho-legend"><span class="eg">せん<span class="cho">せ<b>い</b></span></span><span>畫底線的是長音，藍字代表前一個音拉長一拍</span></p>
    <div class="list" id="list"></div>
    <div class="nav">
      <button type="button" id="prev"><small>‹ 上一單元</small><span id="prev-name"></span></button>
      <button type="button" id="next"><small>下一單元 ›</small><span id="next-name"></span></button>
    </div>
    <p class="tip" id="learn-tip">點任一行就會念出日文。沒有聲音的話，請確認手機沒有開靜音。</p>
    </div>
    <div class="view" id="quiz" hidden></div>
    <div class="view" id="guide" hidden></div>
  </div>
</main>

<div class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <div class="sheet-bar">
    <div class="wrap sheet-bar-in">
      <button type="button" class="icon-btn" id="d-close" aria-label="關閉詳細">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <span class="count" id="d-pos"></span>
      <div class="d-nav">
        <button type="button" class="icon-btn" id="d-prev" aria-label="上一個">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon-btn" id="d-next" aria-label="下一個">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="wrap sheet-body" id="d-body"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
// 寫法說明：{漢字|かな} 會變成上方小字標音；「補充」= 課本上的手寫筆記
const KANA = [
  { label: "清音", cols: 5, rows: [
    "あa いi うu えe おo", "かka きki くku けke こko", "さsa しshi すsu せse そso",
    "たta ちchi つtsu てte とto", "なna にni ぬnu ねne のno", "はha ひhi ふfu へhe ほho",
    "まma みmi むmu めme もmo", "やya - ゆyu - よyo", "らra りri るru れre ろro",
    "わwa - - - をo", "んn - - - -",
  ] },
  { label: "濁音・半濁音", cols: 5, rows: [
    "がga ぎgi ぐgu げge ごgo", "ざza じji ずzu ぜze ぞzo", "だda ぢji づzu でde どdo",
    "ばba びbi ぶbu べbe ぼbo", "ぱpa ぴpi ぷpu ぺpe ぽpo",
  ] },
  { label: "拗音", cols: 3, rows: [
    "きゃkya きゅkyu きょkyo", "しゃsha しゅshu しょsho", "ちゃcha ちゅchu ちょcho",
    "にゃnya にゅnyu にょnyo", "ひゃhya ひゅhyu ひょhyo", "みゃmya みゅmyu みょmyo",
    "りゃrya りゅryu りょryo", "ぎゃgya ぎゅgyu ぎょgyo", "じゃja じゅju じょjo",
    "びゃbya びゅbyu びょbyo", "ぴゃpya ぴゅpyu ぴょpyo",
  ] },
];
const UNITS = [
  { id: "kana", title: "五十音 平假名", grid: "kana" },
  {
    id: "greet", title: "每日的招呼語",
    items: [
      { ja: "おはよう ございます。", zh: "早安。" },
      { ja: "こんにちは。", zh: "午安／你好。", note: "最後的「は」念 wa" },
      { ja: "こんばんは。", zh: "晚上好。（晚上見面時）", note: "最後的「は」念 wa" },
      { ja: "お{休|やす}みなさい。", zh: "晚安。（睡前）" },
      { ja: "さようなら。", zh: "再見。" },
      { ja: "じゃあね。", zh: "掰啦、那先這樣囉。（朋友間）", extra: true },
      { ja: "バイバイ。", zh: "掰掰。", extra: true },
      { ja: "ありがとう ございます。", zh: "謝謝。" },
      { ja: "すみません。", zh: "對不起／不好意思。" },
      { ja: "ごめんなさい。", zh: "對不起。（道歉）", extra: true },
      { ja: "お{願|ねが}いします。", zh: "拜託了／麻煩您了。" },
      { ja: "ただいま。", zh: "我回來了。", extra: true },
      { ja: "おかえりなさい。", zh: "歡迎回來。", extra: true },
      { ja: "いただきます。", zh: "我要開動了。（吃飯前）", extra: true },
      { ja: "ごちそうさま（でした）。", zh: "我吃飽了、謝謝招待。（吃飯後）", note: "加「でした」比較禮貌", say: "ごちそうさまでした。", extra: true },
    ],
  },
  { id: "numbers", title: "數字 0～100", grid: "numbers" },
  {
    id: "l1-words", title: "第1課　單語",
    items: [
      { ja: "わたし", kanji: "私", zh: "我", say: "わたし" },
      { ja: "わたしたち", kanji: "私たち", zh: "我們", extra: true },

    // 帳號裡已經有資料：以帳號為準
    const r = readRemote(snap.data());
    const changed = !sameProf(prof, r.prof) || !sameShow(lvShow, r.show);
    prof = r.prof; lvShow = r.show;
    saveLocal();
    setSyncState("saved");
    if (changed) refreshProfViews(true);
  } else if (Object.keys(prof).length || lvShow.size < 3) {
    // 第一次：把這台裝置原本存的上傳到帳號
    profChanged();
  } else {
    setSyncState("saved");
  }
  // 其他裝置改了熟練度時同步過來（自己還沒存完的變更優先）
  ref.onSnapshot((s) => {
    if (!s.exists || s.metadata.hasPendingWrites || sync.timer || sync.inflight) return;
    const r = readRemote(s.data());
    if (sameProf(prof, r.prof) && sameShow(lvShow, r.show)) return;
    prof = r.prof; lvShow = r.show;
    saveLocal();
    refreshProfViews(false);
  }, () => { if (sync.ref) setSyncState("offline"); });
}

function navDetail(step) {

(() => {

let autoplay = null;
function updatePlayAll() {
  const b = $("play-all");
  b.setAttribute("aria-pressed", String(!!autoplay));
  b.querySelector("span").textContent = autoplay ? "停止播放" : "全部播放";
  b.querySelector("svg").innerHTML = autoplay ? '<path d="M7 7h10v10H7z"/>' : '<path d="M7 5v14l11-7z"/>';
}
function stopAll() {
  if (!autoplay) return;
  autoplay = null;
  if (synth) synth.cancel();
  updatePlayAll();
}
function playAll() {
  if (autoplay) { stopAll(); return; }
  const els = Array.from(document.querySelectorAll("#list .item, #list .cell")).filter((el) => el.offsetParent !== null);
  if (!els.length) return;
  const token = autoplay = {};
  updatePlayAll();
  let i = 0;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step = () => {
    if (autoplay !== token) return;
    if (i >= els.length) { stopAll(); return; }
    const el = els[i++];
    el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    speak(el._say, el, () => { if (autoplay === token) setTimeout(step, 450); });
  };
  step();
}
$("play-all").addEventListener("click", playAll);

// ---- 考試 ----
const TYPES = [["mix", "混合"], ["ja2zh", "看日文選答案"], ["zh2ja", "看中文選日文"], ["listen", "聽音選日文"], ["write", "手寫五十音"]];
const COUNTS = [10, 20, 30, 50];
const quiz = {
  units: new Set((store.get("quizUnits") || "").split(",").filter((id) => UNITS.some((u) => u.id === id))),
  type: store.get("quizType") || "mix",
  count: parseInt(store.get("quizCount"), 10) || 10,
  qs: [], i: 0, right: [], wrong: [],
  kanaSecs: new Set((store.get("quizKana") || "清音").split(",").filter((x) => ["清音", "濁音・半濁音", "拗音"].includes(x))),
};
if (!quiz.kanaSecs.size) quiz.kanaSecs.add("清音");
if (!quiz.units.size) quiz.units.add("kana");

function seg(options, current, onPick) {
  const wrap = document.createElement("div");
  wrap.className = "seg";
  options.forEach(([val, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(val === current));
    b.addEventListener("click", () => { onPick(val); renderSetup(); });
    wrap.appendChild(b);
  });
  return wrap;
}
function saveQuiz() {
  store.set("quizUnits", Array.from(quiz.units).join(","));
  store.set("quizType", quiz.type);
  store.set("quizCount", String(quiz.count));
  store.set("quizKana", Array.from(quiz.kanaSecs).join(","));
}

function renderSetup() {
  saveQuiz();
  const box = $("quiz");
  const isWrite = quiz.type === "write";
  box.innerHTML =
    '<div class="unit-head"><h2>出考卷</h2></div>' +
    '<section class="panel"><h3>題型</h3><div id="q-type"></div></section>' +
    (isWrite
      ? '<section class="panel"><h3>五十音範圍</h3><div id="q-kana"></div>' +
        '<p class="hint">看羅馬音，用手指或觸控筆寫出平假名，寫完再自己對答案。</p></section>'
      : '<section class="panel"><div class="panel-head"><h3>範圍</h3>' +
          '<span class="links"><button type="button" class="link" id="q-all">全選</button><button type="button" class="link" id="q-none">清除</button></span></div>' +
          '<div class="checks" id="q-units"></div>' +
          '<label class="check extra-check" for="q-extra"><input type="checkbox" id="q-extra"' + (showExtra ? " checked" : "") + '><span class="check-name">包含「補充」的單字和句子</span></label></section>' +
        '<section class="panel"><h3>熟練度</h3><div id="q-lv"></div><p class="hint">只套用在單字和句子；五十音和數字不分熟練度。</p></section>') +
    '<section class="panel"><h3>題數</h3><div id="q-count"></div></section>' +
    '<button type="button" class="primary" id="q-start">開始考試</button>';
  $("q-type").appendChild(seg(TYPES, quiz.type, (v) => { quiz.type = v; }));
  $("q-count").appendChild(seg(COUNTS.map((n) => [n, n + " 題"]), quiz.count, (v) => { quiz.count = v; }));
  let total = 0;
  if (isWrite) {
    const wrap = document.createElement("div");
    wrap.className = "seg";
    kanaUnit().sections.forEach((sec) => {
      const n = sec.cells.filter(Boolean).length;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = sec.label + " " + n;
      b.setAttribute("aria-pressed", String(quiz.kanaSecs.has(sec.label)));
      b.addEventListener("click", () => {
        if (quiz.kanaSecs.has(sec.label)) {
          if (quiz.kanaSecs.size === 1) { toast("至少要選一種"); return; }
          quiz.kanaSecs.delete(sec.label);
        } else quiz.kanaSecs.add(sec.label);
        renderSetup();
      });
      wrap.appendChild(b);
    });
    $("q-kana").appendChild(wrap);
    total = kanaPool().length;
  } else {
    const checks = $("q-units");
    const lvCounts = [0, 0, 0];
    UNITS.forEach((u) => {
      const id = "q-u-" + u.id;
      const n = poolOf(u).length;
      if (quiz.units.has(u.id)) {
        total += n;
        if (u.items) u.items.filter(passExtra).forEach((it) => { lvCounts[getLv(keyOf(u, it))]++; });
      }
      const lab = document.createElement("label");
      lab.className = "check";
      lab.setAttribute("for", id);
      lab.innerHTML = '<input type="checkbox" id="' + id + '"' + (quiz.units.has(u.id) ? " checked" : "") + ">" +
        '<span class="check-name">' + esc(u.title) + '</span><span class="count">' + n + "</span>";
      lab.querySelector("input").addEventListener("change", (e) => {
        if (e.target.checked) quiz.units.add(u.id); else quiz.units.delete(u.id);
        renderSetup();
      });
      checks.appendChild(lab);
    });
    $("q-lv").appendChild(lvChips(lvCounts, renderSetup));
    $("q-extra").addEventListener("change", (e) => { setShowExtra(e.target.checked); renderSetup(); });
    $("q-all").onclick = () => { UNITS.forEach((u) => quiz.units.add(u.id)); renderSetup(); };
    $("q-none").onclick = () => { quiz.units.clear(); renderSetup(); };
  }
  const start = $("q-start");
  start.disabled = total === 0;
  if (!isWrite && quiz.units.size === 0) start.textContent = "請先勾選範圍";
  else if (total === 0) start.textContent = "沒有符合條件的題目";
  else if (total < quiz.count) start.textContent = "開始考試（共 " + total + " 題）";
  start.onclick = startQuiz;
}

function makeQuestions() {
  if (quiz.type === "write") {
    return shuffle(kanaPool()).slice(0, quiz.count).map((q) => ({ q: { ...q }, type: "write" }));
  }
  const chosen = UNITS.filter((u) => quiz.units.has(u.id));
  const all = chosen.flatMap((u) => poolOf(u));
  return shuffle(all).slice(0, quiz.count).map((q) => {
    const type = quiz.type === "mix" ? ["ja2zh", "zh2ja", "listen"][Math.floor(Math.random() * 3)] : quiz.type;
    const field = type === "ja2zh" ? "zh" : "ja";
    const seen = new Set([q[field]]);
    const opts = [q];
    // 錯誤選項：先從同一個單元挑，不夠再放寬（不管熟練度、補充），最後才用其他單元
    const sources = [shuffle(poolOf(q.unit)), shuffle(poolOf(q.unit, true)), shuffle(all)];
    for (const src of sources) {
      for (const p of src) {
        if (opts.length >= 4) break;
        if (seen.has(p[field])) continue;
        seen.add(p[field]);
        opts.push(p);
      }
    }
    return { q, type, field, opts: shuffle(opts) };
  });
}

function startQuiz() {
  quiz.qs = makeQuestions();
  quiz.i = 0; quiz.right = []; quiz.wrong = [];
  renderQuestion();
}

function renderQuestion() {
  if (quiz.qs[quiz.i].type === "write") return renderWrite();
  const box = $("quiz");
  const { q, type, field, opts } = quiz.qs[quiz.i];
  const total = quiz.qs.length;
  let prompt = "";
  if (type === "ja2zh") {
    prompt = '<div class="q-ja' + (q.ja.includes("\n") ? " long" : "") + '">' + jaHTML(q.ja) + "</div>" +
      (q.sub ? '<div class="kanji">' + esc(q.sub) + "</div>" : "") +
      '<button type="button" class="mini-play" id="q-say" aria-label="聽發音">' + PLAY_ICON + "</button>";
  } else if (type === "zh2ja") {
    prompt = '<div class="q-zh">' + esc(q.zh) + "</div>";
  } else {
    prompt = '<button type="button" class="big-play" id="q-say" aria-label="再聽一次">' + PLAY_ICON + "</button>" +
      '<div class="count">點喇叭可以再聽一次</div>';
  }
  box.innerHTML =
    '<div class="unit-head"><h2>第 ' + (quiz.i + 1) + " / " + total + ' 題</h2><span class="count">答對 ' + quiz.right.length + "</span></div>" +
    '<div class="bar"><span style="width:' + (quiz.i / total * 100) + '%"></span></div>' +
    '<section class="prompt"><div class="ask">' + esc(askOf(q.unit, type)) + "</div>" + prompt + "</section>" +
    '<div class="opts" id="q-opts"></div>' +
    '<div class="feedback" id="q-fb" hidden></div>' +
    '<button type="button" class="ghost" id="q-quit">結束考試</button>' +
    (quiz.i === 0 ? '<p class="hint kb-hint">有鍵盤的話：按 <kbd>1</kbd>～<kbd>4</kbd> 作答，<kbd>Enter</kbd> 下一題，<kbd>空白鍵</kbd> 再聽一次。</p>' : "");
  if ($("q-say")) $("q-say").onclick = (e) => speak(q.say, e.currentTarget);
  const wrap = $("q-opts");
  const btns = new Map();
  opts.forEach((o) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (field === "ja" ? " ja-opt" : "");
    b.innerHTML = field === "ja" ? jaHTML(o.ja) : esc(o.zh);
    b.dataset.n = wrap.children.length + 1;
    b.addEventListener("click", () => answer(o, b, btns));
    wrap.appendChild(b);
    btns.set(o, b);
  });
  $("q-quit").onclick = showResult;
  if (type === "listen") speak(q.say, $("q-say"));
}

function answer(o, btn, btns) {
  const { q } = quiz.qs[quiz.i];
  btns.forEach((b) => { b.disabled = true; });
  const ok = o === q;
  (ok ? quiz.right : quiz.wrong).push(q);
  btns.get(q).classList.add("right");
  if (!ok) btn.classList.add("wrong");
  const last = quiz.i === quiz.qs.length - 1;
  const token = quiz.token = {};
  // 答對：念完正確答案後自動下一題；答錯：停下來讓你看清楚
  speak(q.say, null, () => {
    if (ok && quiz.token === token && !$("quiz").hidden && $("q-next")) setTimeout(() => {
      if (quiz.token === token && $("q-next")) $("q-next").click();
    }, 350);
  });
  const fb = $("q-fb");
  fb.className = "feedback " + (ok ? "ok" : "bad");
  fb.innerHTML = '<span class="fb-text">' + (ok ? "答對了！馬上下一題…" : "答錯了，正確答案已標成綠色") + "</span>" +
    '<button type="button" class="primary" id="q-next">' + (last ? "看成績" : "下一題") + "</button>";
  fb.hidden = false;
  $("q-next").onclick = () => {
    quiz.token = null;
    if (last) return showResult();
    quiz.i++;
    renderQuestion();
    window.scrollTo(0, 0);
  };
  $("q-next").focus({ preventScroll: true });
  fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function showResult() {
  quiz.token = null;
  if (synth) synth.cancel();
  const done = quiz.wrong.length + quiz.right.length;
  const total = quiz.qs.length;
  const pct = done ? Math.round(quiz.right.length / done * 100) : 0;
  // 只有單字、句子有熟練度
  const keyed = (arr) => arr.filter((x) => x.item).map((x) => keyOf(x.unit, x.item));
  const isWrite = quiz.qs.length && quiz.qs[0].type === "write";
  const wrongUp = keyed(quiz.wrong).filter((k) => getLv(k) > 0);
  const rightUp = keyed(quiz.right).filter((k) => getLv(k) < 2);
  const box = $("quiz");
  box.innerHTML =
    '<div class="unit-head"><h2>成績</h2></div>' +
    '<section class="prompt"><div class="score">' + quiz.right.length + '<small> / ' + done + "</small></div>" +
    '<div class="count">' + (done < total ? "（共 " + total + " 題，做了 " + done + " 題）" : (isWrite ? "寫對率 " : "答對率 ") + pct + "%") + "</div></section>" +
    (wrongUp.length || rightUp.length ? '<section class="panel"><h3>更新熟練度</h3><div class="row" id="q-lvup"></div></section>' : "") +
    (isWrite && done ? '<h3 class="sub-h">你寫的字</h3><p class="hint">左邊是你寫的，右邊是正確的字；點一下聽發音。</p><div id="q-review"></div>' : "") +
    (!isWrite && quiz.wrong.length ? '<h3 class="sub-h">答錯的題目</h3><p class="hint">點一行聽發音，按「詳細」看說明和例句。</p><div class="list" id="q-wrong"></div>' : "") +
    '<div class="row"><button type="button" class="primary" id="q-again">再考一次</button>' +
    '<button type="button" class="ghost" id="q-setup">重新選範圍</button></div>';
  const addLvBtn = (keys, label, to) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ghost";
    b.textContent = label;
    b.addEventListener("click", () => {
      keys.forEach((k) => setLv(k, to(getLv(k))));
      b.disabled = true;
      b.textContent = "已更新 " + keys.length + " 個";
    });
    $("q-lvup").appendChild(b);
  };
  if (rightUp.length) addLvBtn(rightUp, "答對的 " + rightUp.length + " 個升一級", (v) => Math.min(2, v + 1));
  if (wrongUp.length) addLvBtn(wrongUp, "答錯的 " + wrongUp.length + " 個改回「不熟」", () => 0);
  if (isWrite && done) $("q-review").appendChild(writeReview());
  if (!isWrite) quiz.wrong.forEach((w) => {
    $("q-wrong").appendChild(w.item ? itemRow(w.item, w.unit, false) : itemRow({ ja: w.ja, kanji: w.sub, zh: w.zh, say: w.say }, null, false));
  });
  $("q-again").onclick = () => { startQuiz(); window.scrollTo(0, 0); };
  $("q-setup").onclick = () => { renderSetup(); window.scrollTo(0, 0); };
}

// ---- 手寫五十音 ----
const KANA_SECS = ["清音", "濁音・半濁音", "拗音"];
const kanaUnit = () => UNITS.find((u) => u.grid === "kana");
function kanaPool() {
  const u = kanaUnit();
  return u.sections.filter((s) => quiz.kanaSecs.has(s.label))
    .flatMap((s) => s.cells.filter(Boolean).map((c) => ({ ja: c.big, zh: c.small, say: c.say, unit: u })));
}
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const HAND_FONT = '"Klee One", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif';

// 寫字板：筆畫存成 0～1 的座標，換尺寸也能重畫
function makePad(canvas) {
  const pad = { strokes: [], overlay: null, locked: false, penSeen: false, onChange: null };
  let cur = null, size = 0;
  const ctx = canvas.getContext("2d");
  function fit() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || Math.round(rect.width) === size) return;
    size = Math.round(rect.width);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function guides() {
    ctx.save();
    ctx.strokeStyle = cssVar("--line");
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size);
    ctx.moveTo(0, size / 2); ctx.lineTo(size, size / 2);
    ctx.stroke();
    ctx.restore();
  }
  function drawOverlay() {
    if (!pad.overlay) return;
    const n = Array.from(pad.overlay).length;
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = cssVar("--ai");
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "600 " + Math.round(size * (n > 1 ? 0.5 : 0.78)) + "px " + HAND_FONT;
    ctx.fillText(pad.overlay, size / 2, size / 2 + size * 0.03);
    ctx.restore();
  }
  function strokeSeg(a, b) {
    ctx.lineWidth = ((a.w + b.w) / 2) * size;
    ctx.beginPath();
    ctx.moveTo(a.x * size, a.y * size);
    ctx.lineTo(b.x * size, b.y * size);
    ctx.stroke();
  }
  function drawStroke(st) {
    if (st.length === 1) {
      ctx.beginPath();
      ctx.arc(st[0].x * size, st[0].y * size, (st[0].w * size) / 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    for (let i = 1; i < st.length; i++) strokeSeg(st[i - 1], st[i]);
  }
  function draw() {
    ctx.clearRect(0, 0, size, size);
    guides();
    drawOverlay();
    ctx.strokeStyle = ctx.fillStyle = cssVar("--ink");
    ctx.lineCap = ctx.lineJoin = "round";
    pad.strokes.forEach(drawStroke);
  }
  function point(e) {
    const r = canvas.getBoundingClientRect();
    // Apple Pencil 等觸控筆：依壓力改變粗細
    const base = 0.034;
    const w = e.pointerType === "pen" && e.pressure > 0 ? base * (0.55 + e.pressure * 0.9) : base;
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, w };
  }
  canvas.addEventListener("pointerdown", (e) => {
    if (pad.locked) return;
    if (e.pointerType === "pen") pad.penSeen = true;
    else if (e.pointerType === "touch" && pad.penSeen) return; // 用筆的時候忽略手掌
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    cur = { id: e.pointerId, pts: [point(e)] };
    pad.strokes.push(cur.pts);
    ctx.strokeStyle = ctx.fillStyle = cssVar("--ink");
    ctx.lineCap = ctx.lineJoin = "round";
    drawStroke(cur.pts);
    if (pad.onChange) pad.onChange();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!cur || e.pointerId !== cur.id) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (evs.length ? evs : [e]).forEach((ev) => {
      const p = point(ev);
      const last = cur.pts[cur.pts.length - 1];
      cur.pts.push(p);
      strokeSeg(last, p);
    });
  });
  const end = (e) => { if (cur && e.pointerId === cur.id) cur = null; };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  pad.undo = () => { if (pad.locked) return; pad.strokes.pop(); draw(); if (pad.onChange) pad.onChange(); };
  pad.clear = () => { if (pad.locked) return; pad.strokes = []; draw(); if (pad.onChange) pad.onChange(); };
  pad.reveal = (kana) => { pad.overlay = kana; pad.locked = true; draw(); };
  pad.snapshot = () => {
    // 存下自己寫的字（不含提示），給成績頁看
    const keep = pad.overlay;
    pad.overlay = null; draw();
    const url = canvas.toDataURL("image/png");
    pad.overlay = keep; draw();
    return url;
  };
  pad.fit = fit;
  fit();
  return pad;
}

let activePad = null;
window.addEventListener("resize", () => { if (activePad) activePad.fit(); });

function renderWrite() {
  const box = $("quiz");
  const { q } = quiz.qs[quiz.i];
  const total = quiz.qs.length;
  box.innerHTML =
    '<div class="unit-head"><h2>第 ' + (quiz.i + 1) + " / " + total + ' 題</h2><span class="count">寫對 ' + quiz.right.length + "</span></div>" +
    '<div class="bar"><span style="width:' + (quiz.i / total * 100) + '%"></span></div>' +
    '<section class="prompt w-prompt"><div class="ask">用平假名寫出這個音</div>' +
      '<div class="q-roma">' + esc(q.zh) + "</div>" +
      '<button type="button" class="pill" id="q-say">' + PLAY_ICON + "<span>聽發音</span></button></section>" +
    '<div class="write-area">' +
      '<div class="pad-wrap"><canvas id="pad" aria-label="手寫區：用手指或觸控筆寫出平假名"></canvas>' +
        '<span class="pad-hint" id="pad-hint">在這裡寫</span></div>' +
      '<div class="answer-box" id="w-answer" hidden><span class="eyebrow">正確答案</span>' +
        '<span class="w-kana">' + esc(q.ja) + '</span><span class="count">' + esc(q.zh) + "</span></div>" +
    "</div>" +
    '<div class="w-tools" id="w-tools">' +
      '<button type="button" class="ghost" id="w-undo">復原一筆</button>' +
      '<button type="button" class="ghost" id="w-clear">清除</button>' +
      '<button type="button" class="primary" id="w-check">對答案</button>' +
    "</div>" +
    '<div class="judge" id="w-judge" hidden></div>' +
    '<button type="button" class="ghost" id="q-quit">結束考試</button>' +
    (quiz.i === 0 ? '<p class="hint">寫完按「對答案」，跟正確的字比一比，再選自己有沒有寫對。有觸控筆（例如 Apple Pencil）會更好寫。</p>' : "");
  const pad = activePad = makePad($("pad"));
  // 先把手寫範本字體載好，對答案時才畫得出來
  if (document.fonts && document.fonts.load) document.fonts.load("600 80px \"Klee One\"", q.ja).catch(() => {});
  const hint = $("pad-hint");
  const check = $("w-check");
  pad.onChange = () => {
    hint.hidden = pad.strokes.length > 0;
    check.textContent = pad.strokes.length ? "對答案" : "不會寫，看答案";
  };
  pad.onChange();
  $("q-say").onclick = (e) => speak(q.say, e.currentTarget);
  $("w-undo").onclick = () => pad.undo();
  $("w-clear").onclick = () => pad.clear();
  $("q-quit").onclick = showResult;
  check.onclick = () => {
    const empty = pad.strokes.length === 0;
    q._img = empty ? null : pad.snapshot();
    pad.reveal(q.ja);
    if (document.fonts && document.fonts.load) document.fonts.load("600 80px \"Klee One\"", q.ja).then(() => pad.reveal(q.ja)).catch(() => {});
    hint.hidden = true;
    $("w-answer").hidden = false;
    $("w-tools").hidden = true;
    speak(q.say, null);
    const judge = $("w-judge");
    judge.hidden = false;
    const last = quiz.i === quiz.qs.length - 1;
    const next = (right) => {
      (right ? quiz.right : quiz.wrong).push(q);
      activePad = null;
      if (last) return showResult();
      quiz.i++;
      renderQuestion();
      window.scrollTo(0, 0);
    };
    if (empty) {
      judge.innerHTML = '<span class="fb-text">沒關係，記住正確的寫法。</span>' +
        '<button type="button" class="primary" id="w-next">' + (last ? "看成績" : "下一題") + "</button>";
      $("w-next").onclick = () => next(false);
      $("w-next").focus({ preventScroll: true });
    } else {
      judge.innerHTML = '<span class="fb-text">跟正確答案比一比，你寫對了嗎？</span>' +
        '<div class="judge-btns"><button type="button" class="ghost bad-btn" id="w-no">寫錯了</button>' +
        '<button type="button" class="primary ok-btn" id="w-yes">寫對了</button></div>';
      $("w-yes").onclick = () => next(true);
      $("w-no").onclick = () => next(false);
    }
    judge.scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
}

// 成績頁：把自己寫的字和正確答案排在一起
function writeReview() {
  const cards = quiz.wrong.map((q) => [q, false]).concat(quiz.right.map((q) => [q, true]));
  if (!cards.length) return null;
  const grid = document.createElement("div");
  grid.className = "w-review";
  cards.forEach(([q, ok]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "w-card " + (ok ? "ok" : "bad");
    b.innerHTML =
      '<span class="w-mine">' + (q._img ? '<img alt="我寫的「' + esc(q.ja) + '」" src="' + q._img + '">' : '<span class="count">沒有寫</span>') + "</span>" +
      '<span class="w-right"><span class="w-kana">' + esc(q.ja) + '</span><span class="count">' + esc(q.zh) + "</span></span>" +
      '<span class="w-badge">' + (ok ? "寫對" : "寫錯") + "</span>";
    b.setAttribute("aria-label", "播放：" + q.ja);
    b.addEventListener("click", () => speak(q.say, b));
    grid.appendChild(b);
  });
  return grid;
}

// ---- 教學 ----
// 段落文字：保留換行、支援標音、自動標出長音
const richText = (s) => toRuby(s);
// 顯示用：拿掉標音記號，保留原本的空格
const plainJa = (s) => s.replace(/\{([^|}]+)\|[^}]+\}/g, "$1");

function exButton(ex, extraClass) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ex" + (extraClass ? " " + extraClass : "");
  b.innerHTML =
    '<span class="text"><span class="ja' + (ex.ja.includes("\n") ? " long" : "") + '">' + jaHTML(ex.ja) + "</span>" +
    '<span class="zh">' + esc(ex.zh) + "</span></span>" +
    '<span class="play">' + PLAY_ICON + "</span>";
  b.setAttribute("aria-label", "播放：" + toSpeech(ex.ja));
  b.addEventListener("click", () => speak(ex.say || toSpeech(ex.ja), b));
  return b;
}

function guideBlock(bl) {
  const el = document.createElement("div");
  if (bl.t === "p") {
    el.className = "g-p";
    el.innerHTML = richText(bl.text);
  } else if (bl.t === "h") {
    el.innerHTML = '<h3 class="g-h">' + esc(bl.text) + "</h3>";
  } else if (bl.t === "tip") {
    el.className = "g-tip";
    el.innerHTML = '<span class="g-tip-label">小提醒</span><div>' + richText(bl.text) + "</div>";
  } else if (bl.t === "formula") {
    el.className = "formula";
    el.setAttribute("role", "img");
    el.setAttribute("aria-label", "句型：" + bl.parts.map((p) => p.ja).join(" "));
    el.innerHTML = bl.parts.map((p) =>
      '<span class="f-part' + (p.v ? " f-var" : "") + '"><b>' + esc(p.ja) + "</b><small>" + esc(p.zh) + "</small></span>"
    ).join("");
  } else if (bl.t === "break") {
    el.className = "breakdown";
    el.innerHTML = '<div class="bw-row">' + bl.words.map((w) =>
      '<span class="bw"><span class="bw-ja">' + toRuby(w.ja) + '</span><span class="bw-zh">' + esc(w.zh) + "</span></span>"
    ).join("") + "</div>";
    el.appendChild(exButton(bl.full));
  } else if (bl.t === "ex") {
    el.className = "ex-list";
    bl.items.forEach((ex) => el.appendChild(exButton(ex)));
  } else if (bl.t === "pairs") {
    el.className = "pairs";
    bl.items.forEach(([a, b]) => {
      const row = document.createElement("div");
      row.className = "pair-row";
      row.appendChild(exButton(a, "pair"));
      row.appendChild(exButton(b, "pair"));
      el.appendChild(row);
    });
  } else if (bl.t === "rules") {
    el.className = "rules";
    bl.items.forEach((r) => {
      const b = exButton(r, "rule-row");
      b.insertAdjacentHTML("afterbegin", '<span class="rule">' + esc(r.rule) + "</span>");
      el.appendChild(b);
    });
  } else if (bl.t === "quiz") {
    el.className = "panel g-quiz";
    renderGuideQuiz(el, bl.items);
  }
  return el;
}

function renderGuideQuiz(box, items) {
  box.innerHTML = '<div class="panel-head"><h3>小練習</h3><button type="button" class="link">重新作答</button></div>';
  box.querySelector(".link").addEventListener("click", () => renderGuideQuiz(box, items));
  items.forEach((it, qi) => {
    const wrap = document.createElement("div");
    wrap.className = "gq";
    // 聽力題：每次隨機念其中一個
    let options = it.options, answer = it.answer, isJa = it.ja, sayAnswer = null;
    if (it.listen) {
      options = it.listen;
      answer = Math.floor(Math.random() * it.listen.length);
      isJa = true;
      sayAnswer = toSpeech(it.listen[answer].ja);
    }
    wrap.innerHTML = '<p class="gq-q"><span class="gq-n">' + (qi + 1) + "</span>" + esc(it.q) + "</p>";
    if (sayAnswer) {
      const lb = document.createElement("button");
      lb.type = "button";
      lb.className = "pill gq-listen";
      lb.innerHTML = PLAY_ICON + "<span>播放題目</span>";
      lb.addEventListener("click", () => speak(sayAnswer, lb));
      wrap.appendChild(lb);
    }
    const opts = document.createElement("div");
    opts.className = "gq-opts";
    const why = document.createElement("p");
    why.className = "gq-why";
    why.hidden = true;
    const btns = options.map((o, oi) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt" + (isJa ? " ja-opt" : "");
      const ja = typeof o === "string" ? o : o.ja;
      b.innerHTML = isJa
        ? jaHTML(ja) + (typeof o === "object" && o.zh ? '<small class="opt-zh">' + esc(o.zh) + "</small>" : "")
        : esc(o);
      b.addEventListener("click", () => {
        btns.forEach((x) => { x.disabled = true; });
        const right = oi === answer;
        btns[answer].classList.add("right");
        if (!right) b.classList.add("wrong");
        const ans = options[answer];
        why.className = "gq-why " + (right ? "ok" : "bad");
        const ansJa = typeof ans === "string" ? ans : ans.ja;
        why.textContent = (right ? "答對了！" : "答錯了，正確答案是「" + plainJa(ansJa) + "」。") + (it.why ? " " + it.why : "");
        why.hidden = false;
        if (isJa) speak(sayAnswer || toSpeech(ansJa), null);
      });
      opts.appendChild(b);
      return b;
    });
    wrap.appendChild(opts);
    wrap.appendChild(why);
    box.appendChild(wrap);
  });
}

function renderGuide(id) {
  const box = $("guide");
  box.innerHTML = "";
  const idx = GUIDES.findIndex((g) => g.id === id);
  if (idx < 0) {
    // 目錄
    box.innerHTML =
      '<div class="unit-head"><div class="title-block"><span class="eyebrow">教學・' + GUIDES.length + ' 課</span><h2>文法教學</h2></div></div>' +
      '<p class="hint">從長音開始，一課一課看下去。每課最後都有小練習。</p>';
    const list = document.createElement("div");
    list.className = "guide-list";
    GUIDES.forEach((g, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "guide-card";
      b.innerHTML = '<span class="g-num">' + (i + 1) + '</span><span class="g-txt"><b>' + esc(g.title) + "</b><small>" + toRuby(g.sub) + "</small></span>" +
        '<span class="chev">' + CHEVRON + "</span>";
      b.addEventListener("click", () => go("guide-" + g.id));
      list.appendChild(b);
    });
    box.appendChild(list);
    return;
  }
  const g = GUIDES[idx];
  const head = document.createElement("div");
  head.className = "g-head";
  head.innerHTML =
    '<button type="button" class="link g-back">‹ 教學目錄</button>' +
    '<span class="eyebrow">教學 ' + (idx + 1) + " / " + GUIDES.length + "</span>" +
    "<h2>" + esc(g.title) + "</h2>" +
    '<p class="g-sub">' + toRuby(g.sub) + "</p>";
  head.querySelector(".g-back").addEventListener("click", () => go("guide"));
  box.appendChild(head);
  g.blocks.forEach((bl) => box.appendChild(guideBlock(bl)));
  const nav = document.createElement("div");
  nav.className = "nav";
  nav.innerHTML =
    '<button type="button" id="g-prev"><small>‹ 上一課</small><span></span></button>' +
    '<button type="button" id="g-next"><small>下一課 ›</small><span></span></button>';
  box.appendChild(nav);
  const prev = GUIDES[idx - 1], next = GUIDES[idx + 1];
  const pb = nav.querySelector("#g-prev"), nb = nav.querySelector("#g-next");
  pb.disabled = !prev; nb.disabled = !next;
  if (prev) { pb.querySelector("span").textContent = prev.title; pb.onclick = () => go("guide-" + prev.id); }
  if (next) { nb.querySelector("span").textContent = next.title; nb.onclick = () => go("guide-" + next.id); }
}

// ---- 切換畫面 ----
function render(hash) {
  closeDetail();
  stopAll();
  if (synth) synth.cancel();
  quiz.token = null;
  const isQuiz = hash === "quiz";
  const isGuide = hash === "guide" || hash.startsWith("guide-");
  const isLearn = !isQuiz && !isGuide;
  $("learn").hidden = !isLearn;
  $("quiz").hidden = !isQuiz;
  $("guide").hidden = !isGuide;
  $("unit").hidden = !isLearn;
  $("tab-learn").setAttribute("aria-pressed", String(isLearn));
  $("tab-quiz").setAttribute("aria-pressed", String(isQuiz));
  $("tab-guide").setAttribute("aria-pressed", String(isGuide));
  if (isQuiz) { renderSetup(); return; }
  if (isGuide) { renderGuide(hash.replace(/^guide-?/, "")); return; }
  let idx = UNITS.findIndex((u) => u.id === hash);
  if (idx < 0) idx = Math.max(0, UNITS.findIndex((u) => u.id === store.get("unit")));
  renderUnit(idx);
}
function go(id) {
  if (location.hash.slice(1) === id) render(id);
  else location.hash = id;
  window.scrollTo(0, 0);
}
$("unit").addEventListener("change", (e) => go(e.target.value));
$("tab-learn").addEventListener("click", () => go(store.get("unit") || UNITS[0].id));
$("tab-quiz").addEventListener("click", () => go("quiz"));
$("tab-guide").addEventListener("click", () => go("guide"));
window.addEventListener("hashchange", () => render(location.hash.slice(1)));
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("detail").hidden) {
    if (e.key === "Escape") { e.preventDefault(); closeDetail(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); navDetail(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); navDetail(1); }
    return;
  }
  if ($("quiz").hidden) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select") return;
  const opt = document.querySelector('.opt[data-n="' + e.key + '"]');
  if (opt && !opt.disabled) { e.preventDefault(); opt.click(); return; }
  if (e.key === "Enter" && $("w-check") && !$("w-tools").hidden && tag !== "button") { e.preventDefault(); $("w-check").click(); return; }
  if (e.key === "Enter" && $("w-next")) { e.preventDefault(); $("w-next").click(); return; }
  if (e.key === "Enter" && $("q-next")) { e.preventDefault(); $("q-next").click(); return; }
  if (e.key === " " && $("q-say") && tag !== "button") { e.preventDefault(); $("q-say").click(); }
});

// 語速
function setRate(r) {
  rate = r;
  store.set("rate", String(r));
  document.querySelectorAll(".speed button").forEach((b) => {
    b.setAttribute("aria-pressed", String(parseFloat(b.dataset.rate) === r));
  });
}
document.querySelectorAll(".speed button").forEach((b) => {
  b.addEventListener("click", () => setRate(parseFloat(b.dataset.rate)));
});
setRate(rate);

render(location.hash.slice(1));
startSync();
</script>
<!--BODY-END-->
</body>
