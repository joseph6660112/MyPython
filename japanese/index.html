<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>日文聽讀本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 版面：單欄講義，上方固定「單元選單」，每一行點一下就念出來 */
:root {
  --paper: #eef1f6;
  --sheet: #ffffff;
  --ink: #1b2232;
  --muted: #5d6779;
  --line: #dde2ec;
  --ai: #2c4a8a;          /* 藍染色：主色 */
  --ai-soft: #e3e9f6;
  --pencil: #6f6a5f;      /* 鉛筆色：手寫補充 */
  --pencil-soft: #efece4;
  --cho-line: #93a8db;    /* 長音底線 */
  --ok: #1d7a4c;
  --ok-soft: #e1f2e8;
  --bad: #b3261e;
  --bad-soft: #fbe6e3;
  --lv0: #c2410c; --lv0-soft: #fdeadf;   /* 不熟 */
  --lv1: #9a6a00; --lv1-soft: #fbf0d3;   /* 普通 */
  --lv2: #1d7a4c; --lv2-soft: #e1f2e8;   /* 熟練 */
  --font-ja: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-zh: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141c; --sheet: #181e2a; --ink: #e5e9f1; --muted: #9aa4b7; --line: #283043;
    --ai: #94adea; --ai-soft: #222f4d; --pencil: #c2bba9; --pencil-soft: #2a2924; --cho-line: #5a72b0;
    --ok: #6fd3a0; --ok-soft: #173528; --bad: #f2948a; --bad-soft: #3d1f1c;
    --lv0: #fb9a6c; --lv0-soft: #3a2216; --lv1: #e8c35a; --lv1-soft: #352c14; --lv2: #6fd3a0; --lv2-soft: #173528;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141c; --sheet: #181e2a; --ink: #e5e9f1; --muted: #9aa4b7; --line: #283043;
  --ai: #94adea; --ai-soft: #222f4d; --pencil: #c2bba9; --pencil-soft: #2a2924; --cho-line: #5a72b0;
  --ok: #6fd3a0; --ok-soft: #173528; --bad: #f2948a; --bad-soft: #3d1f1c;
    --lv0: #fb9a6c; --lv0-soft: #3a2216; --lv1: #e8c35a; --lv1-soft: #352c14; --lv2: #6fd3a0; --lv2-soft: #173528;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-zh);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet);
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 上方選單 */
header {
  box-shadow: 0 1px 0 var(--line), 0 6px 16px -12px rgba(20, 30, 60, .25);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--sheet);
  border-bottom: 1px solid var(--line);
}
header .wrap { padding-block: 12px; display: grid; gap: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-ja); font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; }
h1 .accent { color: var(--ai); margin-left: -8px; }
.seal {
  display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
  background: var(--ai); color: var(--sheet); font-size: 1rem; letter-spacing: 0;
}
.top-tools { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer;
  background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 50%;
}
.icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
.icon-btn[aria-expanded="true"] { color: var(--ai); border-color: var(--ai); background: var(--ai-soft); }
.settings { display: grid; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--line); }
.set-label { font-size: .9rem; font-weight: 700; padding-top: 8px; }
.set-row { display: flex; gap: 8px; }
.set-row select { flex: 1; min-width: 0; }
.small-btn { padding: 8px 16px; font-size: .9rem; }
.settings .hint { line-height: 1.7; }
.speed { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex-shrink: 0; }
.speed button {
  border: 0; background: none; color: var(--muted); font: inherit; font-size: .85rem;
  padding: 4px 12px; border-radius: 999px; cursor: pointer;
}
.speed button[aria-pressed="true"] { background: var(--ai); color: var(--sheet); }
.bar-row { display: flex; gap: 10px; align-items: center; }
.bar-row select { flex: 1; min-width: 0; }
.tabs, .seg { display: flex; flex-wrap: wrap; gap: 6px; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.tabs { flex-shrink: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button, .seg button {
  font: inherit; font-size: .95rem; cursor: pointer; color: var(--muted);
  background: none; border: 0; border-radius: 8px; padding: 7px 14px;
}
.tabs button[aria-pressed="true"] { background: var(--sheet); color: var(--ai); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
select {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}

/* 單元內容 */
main .wrap { padding-block: 20px 40px; display: grid; gap: 14px; }
.unit-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.unit-head .pill { flex-shrink: 0; }
h2 { margin: 0; font-family: var(--font-ja); font-size: 1.4rem; text-wrap: balance; }
.count { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.list { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px;
  border-top: 1px solid var(--line); padding-right: 12px;
}
.item:first-child { border-top: 0; }
.item.playing { background: var(--ai-soft); }
.item.faded { opacity: .45; }
.item-main {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px;
  min-width: 0; width: 100%; text-align: left; font: inherit; color: inherit;
  background: none; border: 0; padding: 14px 2px 14px 16px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.item-main:focus-visible { outline: 2px solid var(--ai); outline-offset: -2px; border-radius: 8px; }
.chev { display: grid; color: var(--muted); opacity: .55; }
.chev svg { width: 18px; height: 18px; }
.lv {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer;
  font: inherit; font-size: .74rem; font-weight: 700; letter-spacing: .04em;
  border: 0; border-radius: 999px; padding: 5px 9px;
}
.lv::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.lv.lv0 { color: var(--lv0); background: var(--lv0-soft); }
.lv.lv1 { color: var(--lv1); background: var(--lv1-soft); }
.lv.lv2 { color: var(--lv2); background: var(--lv2-soft); }
.empty { margin: 0; padding: 28px 18px; text-align: center; color: var(--muted); font-size: .92rem; }
.text { min-width: 0; display: grid; gap: 2px; }
.ja { font-family: var(--font-ja); font-size: 1.3rem; line-height: 1.9; line-break: strict; }
.ja.long { font-size: 1.1rem; }
@media (min-width: 600px) { .ja.long { font-size: 1.25rem; } }
.ja .line { display: block; }
.ja rt { font-size: .5em; color: var(--muted); letter-spacing: .02em; }
.kanji { font-family: var(--font-ja); color: var(--muted); font-size: .95rem; }
.zh { color: var(--muted); font-size: .95rem; white-space: pre-line; }
.tag {
  display: inline-block; font-size: .72rem; letter-spacing: .06em; color: var(--pencil);
  background: var(--pencil-soft); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px;
}
.note { color: var(--pencil); font-size: .82rem; }
.play {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ai-soft); color: var(--ai); flex-shrink: 0;
  border: 0; padding: 0; cursor: pointer;
}
.play svg { width: 18px; height: 18px; fill: currentColor; }
.item.playing .play { background: var(--ai); color: var(--sheet); }

/* 五十音表 */
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.cell {
  display: grid; place-items: center; gap: 0; aspect-ratio: 1 / 1; max-width: 100%;
  font: inherit; color: inherit; cursor: pointer; padding: 4px;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 12px;
  -webkit-tap-highlight-color: transparent;
}
.cell:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.cell.playing { background: var(--ai); color: var(--sheet); border-color: var(--ai); }
.cell .k { font-family: var(--font-ja); font-size: clamp(1.6rem, 7vw, 2.4rem); line-height: 1.1; }
.cell .r { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.cell.playing .r { color: inherit; }
.gap { aspect-ratio: 1 / 1; }
.kana { display: grid; gap: 12px; }
.kana h3 { margin: 10px 0 0; font-size: 1rem; color: var(--muted); font-weight: 700; }
.kana h3:first-child { margin-top: 0; }
.grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.g3 .cell { aspect-ratio: auto; padding-block: 10px; }
.grid.gn { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gn .cell { aspect-ratio: auto; grid-template-columns: 2.6em 1fr; justify-items: start; gap: 8px; padding: 10px 12px; }
.gn .cell .k { font-family: var(--font-zh); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.gn .cell .r { font-family: var(--font-ja); font-size: .95rem; color: var(--ink); letter-spacing: 0; }
@media (min-width: 600px) {
  .grid.gn { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
  .gn .cell { grid-template-columns: none; justify-items: center; gap: 2px; padding-inline: 4px; }
  .gn .cell .r { font-size: .82rem; white-space: nowrap; }
}

/* 考試 */
.view { display: grid; gap: 14px; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.panel h3, .sub-h { margin: 0; font-size: 1rem; }
.sub-h { color: var(--muted); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.links { display: flex; gap: 4px; }
.link { font: inherit; font-size: .9rem; color: var(--ai); background: none; border: 0; padding: 4px 8px; cursor: pointer; }
.checks { display: grid; gap: 2px; }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 4px; cursor: pointer; border-radius: 8px; }
.check input { width: 20px; height: 20px; accent-color: var(--ai); margin: 0; flex-shrink: 0; }
.check-name { flex: 1; min-width: 0; }
.seg button { border: 1px solid var(--line); background: var(--paper); }
.seg button[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: var(--sheet); }
.primary {
  font: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer;
  color: var(--sheet); background: var(--ai); border: 0; border-radius: 12px; padding: 13px 20px;
}
.primary:disabled { opacity: .45; cursor: default; }
.ghost {
  font: inherit; font-size: .95rem; cursor: pointer; color: var(--muted);
  background: none; border: 1px solid var(--line); border-radius: 12px; padding: 11px 18px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > * { flex: 1 1 160px; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ai); border-radius: 99px; }
.prompt {
  background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 22px 16px;
  display: grid; justify-items: center; gap: 8px; text-align: center;
}
.ask { color: var(--muted); font-size: .9rem; }
.q-ja { font-family: var(--font-ja); font-size: 2.2rem; line-height: 1.7; }
.q-ja.long { font-size: 1.2rem; text-align: left; }
.q-ja .line { display: block; }
.q-ja rt { font-size: .45em; color: var(--muted); }
.q-zh { font-size: 1.5rem; white-space: pre-line; text-wrap: balance; }
.mini-play, .big-play {
  display: grid; place-items: center; border: 0; cursor: pointer; border-radius: 50%;
  background: var(--ai-soft); color: var(--ai);
}
.mini-play { width: 40px; height: 40px; }
.mini-play svg { width: 18px; height: 18px; fill: currentColor; }
.big-play { width: 88px; height: 88px; }
.big-play svg { width: 38px; height: 38px; fill: currentColor; }
.mini-play.playing, .big-play.playing { background: var(--ai); color: var(--sheet); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.opt {
  font: inherit; font-size: 1.05rem; color: var(--ink); text-align: left; cursor: pointer;
  background: var(--sheet); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px;
  white-space: pre-line; min-width: 0;
}
.opt.ja-opt { font-family: var(--font-ja); font-size: 1.2rem; white-space: normal; line-height: 1.8; }
.opt.ja-opt .line { display: block; }
.opt rt { font-size: .5em; color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-radius: 12px; padding: 12px 14px; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.fb-text { font-weight: 700; }
.score { font-size: 3.2rem; font-weight: 700; color: var(--ai); font-variant-numeric: tabular-nums; line-height: 1.1; }
.score small { font-size: 1.4rem; color: var(--muted); font-weight: 400; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
.nav button {
  display: grid; gap: 2px; font: inherit; color: var(--ink); cursor: pointer; text-align: left;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0;
}
.nav button small { color: var(--ai); font-size: .8rem; }
.nav button span { font-family: var(--font-ja); font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav #next { text-align: right; grid-column: 2; }
.nav button:disabled { visibility: hidden; }
.title-block { display: grid; gap: 2px; min-width: 0; }
.eyebrow { font-size: .75rem; letter-spacing: .12em; color: var(--ai); font-weight: 700; }
.tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .88rem; color: var(--muted); user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.switch .track {
  position: relative; width: 38px; height: 22px; border-radius: 999px; flex-shrink: 0;
  background: var(--line); transition: background .2s;
}
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s;
}
.switch input:checked + .track { background: var(--pencil); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:checked ~ span:last-child { color: var(--ink); }
.switch input:focus-visible + .track { outline: 2px solid var(--ai); outline-offset: 2px; }
#list[data-extra="off"] .item.extra { display: none; }
.extra-check { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 12px; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .88rem; cursor: pointer;
  color: var(--ai); background: var(--ai-soft); border: 0; border-radius: 999px; padding: 7px 14px 7px 10px;
}
.pill svg { width: 16px; height: 16px; fill: currentColor; }
.pill[aria-pressed="true"] { background: var(--ai); color: var(--sheet); }
.tip { color: var(--muted); font-size: .8rem; text-align: center; margin: 0; }
.warn { background: var(--pencil-soft); color: var(--pencil); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }
@media (hover: hover) {
  .item:hover { background: var(--paper); }
  .cell:hover { border-color: var(--ai); }
  .check:hover { background: var(--paper); }
  .opt:not(:disabled):hover { border-color: var(--ai); }
  .nav button:hover { border-color: var(--ai); }
}
.item.playing:hover { background: var(--ai-soft); }

/* 熟練度篩選 */
.lvbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lvbar-label { font-size: .85rem; color: var(--muted); }
.lv-filter { display: flex; flex-wrap: wrap; gap: 6px; }
.lvchip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  font: inherit; font-size: .86rem; color: var(--muted);
  background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
}
.lvchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--lvc); opacity: .5; }
.lvchip b { font-weight: 700; font-variant-numeric: tabular-nums; }
.lvchip[aria-pressed="true"] { color: var(--lvc); background: var(--lvc-soft); border-color: var(--lvc); }
.lvchip[aria-pressed="true"] i { opacity: 1; }
.lv0 { --lvc: var(--lv0); --lvc-soft: var(--lv0-soft); }
.lv1 { --lvc: var(--lv1); --lvc-soft: var(--lv1-soft); }
.lv2 { --lvc: var(--lv2); --lvc-soft: var(--lv2-soft); }

/* 詳細頁 */
html.sheet-open, html.sheet-open body { overflow: hidden; }
.sheet {
  position: fixed; inset: 0; z-index: 20; background: var(--paper);
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
}
.sheet-bar {
  position: sticky; top: 0; z-index: 1; background: var(--sheet);
  border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px);
}
.sheet-bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.d-nav { display: flex; gap: 8px; }
.d-nav .icon-btn:disabled { opacity: .35; cursor: default; }
.sheet-body { padding-block: 18px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.d-hero {
  background: var(--sheet); border: 1px solid var(--line); border-radius: 16px;
  padding: 22px 18px; display: grid; gap: 6px; justify-items: start;
}
.d-ja { margin: 0; font-family: var(--font-ja); font-size: 2.1rem; font-weight: 400; line-height: 1.7; line-break: strict; }
.d-ja.long { font-size: 1.3rem; }
.d-ja .line { display: block; }
.d-ja rt { font-size: .45em; color: var(--muted); }
.d-kanji { font-family: var(--font-ja); color: var(--muted); font-size: 1.05rem; }
.d-zh { font-size: 1.1rem; white-space: pre-line; }
.d-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.d-play { display: inline-flex; align-items: center; gap: 8px; }
.d-play svg { width: 18px; height: 18px; fill: currentColor; }
.d-play.playing { outline: 3px solid var(--ai-soft); }
.d-info { margin: 0; white-space: pre-line; line-height: 1.85; }
.lvseg button { display: inline-flex; align-items: center; gap: 6px; }
.lvseg button i { width: 8px; height: 8px; border-radius: 50%; background: var(--lvc); }
.lvseg button[aria-pressed="true"] { background: var(--lvc); border-color: var(--lvc); color: var(--sheet); }
.lvseg button[aria-pressed="true"] i { background: var(--sheet); }
.ex-list { display: grid; gap: 8px; }
.ex {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--paper); border: 0; border-radius: 12px; padding: 12px 14px;
}
.ex .ja { font-size: 1.12rem; line-height: 1.85; }
.ex .ja.long { font-size: 1.05rem; }
.ex.playing { background: var(--ai-soft); }

.cell .ja-part, .cell .zh-part { min-width: 2.4em; text-align: center; }

};

const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// {漢字|かな} → <ruby>
// ---- 長音標示 ----
const VOWEL = {};
[["a", "あかさたなはまやらわがざだばぱゃぁアカサタナハマヤラワガザダバパャァ"],
 ["i", "いきしちにひみりぎじぢびぴぃイキシチニヒミリギジヂビピィ"],
 ["u", "うくすつぬふむゆるぐずづぶぷゅぅウクスツヌフムユルグズヅブプュゥ"],
 ["e", "えけせてねへめれげぜでべぺぇエケセテネヘメレゲゼデベペェ"],
 ["o", "おこそとのほもよろをごぞどぼぽょぉオコソトノホモヨロヲゴゾドボポョォ"],
].forEach(([v, chars]) => Array.from(chars).forEach((c) => { VOWEL[c] = v; }));
const SMALL = "ゃゅょぁぃぅぇぉャュョァィゥェォ";
// 前一個音的母音 + 後面這個假名 → 是不是長音
const LENGTHENS = { "あ": "a", "い": "ie", "う": "uo", "え": "e", "お": "o" };
function isLong(prev, next) {
  const v = VOWEL[Array.from(prev).pop()];
  if (!v) return false;
  if (next === "ー") return true;
  return (LENGTHENS[next] || "").includes(v);
}
function markLong(text) {
  const morae = [];
  for (const ch of Array.from(text)) {
    if (SMALL.includes(ch) && morae.length) morae[morae.length - 1] += ch;
    else morae.push(ch);
  }
  let out = "";
  for (let i = 0; i < morae.length; i++) {
    if (i + 1 < morae.length && isLong(morae[i], morae[i + 1])) {
      out += '<span class="cho">' + morae[i] + "<b>" + morae[i + 1] + "</b></span>";
      i++;
    } else out += morae[i];
  }
  return out;
}

// {漢字|かな} → <ruby>，順便標出長音
function toRuby(s) {
  let out = "", last = 0;
  s.replace(/\{([^|}]+)\|([^}]+)\}/g, (m, base, reading, off) => {
    out += markLong(esc(s.slice(last, off)));
    out += "<ruby>" + esc(base) + "<rt>" + markLong(esc(reading)) + "</rt></ruby>";
    last = off + m.length;
    return m;
  });
  return out + markLong(esc(s.slice(last)));
}
function jaHTML(s, tail) {
  const lines = s.split("\n");
  return lines.map((l, i) => '<span class="line">' + toRuby(l) + (i === lines.length - 1 && tail ? tail : "") + "</span>").join("");
}
// 要念出來的文字：去掉標音、括號、～、空白
// 單一個漢字（方、来、人…）念法容易被讀錯，改用標音；兩個字以上的詞用漢字，語音比較準
function toSpeech(s) {
  return s.replace(/\{([^|}]+)\|([^}]+)\}/g, (m, base, reading) => (Array.from(base).length === 1 ? reading : base))
    .replace(/[［］\[\]～]/g, "")
    .replace(/……/g, "")
    .replace(/\n/g, "。")
    .replace(/[ 　]/g, "")
    .replace(/。。/g, "。")
    .replace(/([？！])。/g, "$1");
}
const toKata = (s) => Array.from(s).map((ch) => String.fromCharCode(ch.charCodeAt(0) + 0x60)).join("");

// 把五十音、數字整理成「格子」
function kanaSections(defs) {
  return defs.map((d) => ({
    label: d.label, kind: d.cols === 3 ? "g3" : "g5",
    cells: d.rows.flatMap((row) => row.split(" ").map((c) => {
      if (c === "-") return null;
      const m = c.match(/^([^\x00-\x7f]+)(.*)$/);
      return { big: m[1], small: m[2], say: toKata(m[1]) }; // 用片假名念，避免は、へ、を被當成助詞
    })),
  }));
}
const ONES = ["", "いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう"];
const ALT = { 0: "ゼロ、れい", 4: "よん、し", 7: "なな、しち", 9: "きゅう、く" };
function numReading(n) {
  if (ALT[n]) return ALT[n];
  if (n === 100) return "ひゃく";
  const t = Math.floor(n / 10), o = n % 10;
  return (t ? (t === 1 ? "" : ONES[t]) + "じゅう" : "") + ONES[o];
}
function numSections() {
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const secs = [{ label: "0～10", nums: range(0, 10) }];
  for (let s = 11; s <= 91; s += 10) secs.push({ label: s + "～" + (s + 9), nums: range(s, s + 9) });
  return secs.map((x) => ({
    label: x.label, kind: "gn",
    cells: x.nums.map((n) => ({ big: String(n), small: numReading(n), say: numReading(n) })),
  }));
}

// 考試用的題庫：每個單元都轉成 { ja, sub, zh, say, unit, item }
// full = true 時不管熟練度和補充設定（用來湊錯誤選項）
function poolOf(u, full) {
  if (u.sections) {
    const cells = u.sections.flatMap((s) => s.cells).filter(Boolean);
    if (u.grid === "numbers") return cells.map((c) => ({ ja: c.small, zh: c.big, say: c.say, unit: u }));
    return cells.map((c) => ({ ja: c.big, zh: c.small, say: c.say, unit: u }));

  return (full ? u.items : visibleItems(u))
    .map((it) => ({ ja: it.ja, sub: it.kanji, zh: it.zh, say: sayOf(it), unit: u, item: it }));
}

const synth = window.speechSynthesis;

let jaVoice = null;
// 自動挑最自然的日文語音：加強版／高品質 > 常見好聽的 > 其他
function voiceScore(v) {
  let n = 0;
  if (/premium|enhanced|高品質|加強|プレミアム|拡張|siri/i.test(v.name)) n += 4;
  if (/kyoko|o-ren|otoya|google|nanami|haruka|keita/i.test(v.name)) n += 2;
  if (v.localService) n += 1;
  return n;
}
function pickVoice() {
  if (!synth) return;
  const voices = synth.getVoices().filter((v) => /^ja/i.test(v.lang))
    .sort((a, b) => voiceScore(b) - voiceScore(a));
  const saved = store.get("voice");
  jaVoice = voices.find((v) => v.name === saved) || voices[0] || null;
  const sel = $("voice");
  sel.innerHTML = "";
  if (!voices.length) {
    sel.innerHTML = "<option>（找不到日文語音）</option>";
    sel.disabled = true;
  } else {
    sel.disabled = false;
    voices.forEach((v, i) => {
      const o = document.createElement("option");
      o.value = v.name;
      o.textContent = v.name.replace(/\s*\(.*?\)\s*$/, "") + (i === 0 ? "（推薦）" : "") + (v.localService ? "" : "・需網路");
      if (jaVoice && v.name === jaVoice.name) o.selected = true;
      sel.appendChild(o);
    });
  }
  if (synth.getVoices().length && !voices.length) {
    showWarn("這台裝置找不到日文語音。請到系統設定 → 語言／文字轉語音，加入「日本語」語音。");
  }
}

let playingEl = null;
function speak(text, el, after, rateOverride) {
  if (!synth) { if (after) after(); return; }
  synth.cancel();
  synth.resume(); // Chrome 閒置久了會卡住，先叫醒
  if (playingEl) playingEl.classList.remove("playing");
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  if (jaVoice) u.voice = jaVoice;
  u.rate = rateOverride || rate;
  playingEl = el || null;
  if (el) el.classList.add("playing");
  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    if (el) el.classList.remove("playing");
    if (playingEl === el) playingEl = null;
    if (after) after();
  };
  u.onend = done;
  u.onerror = done;
  synth.speak(u);
}

    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) navDetail(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

// ---- 全部播放：一個接一個念，畫面跟著捲動 ----
let autoplay = null;
function updatePlayAll() {
  const b = $("play-all");
  b.setAttribute("aria-pressed", String(!!autoplay));
  b.querySelector("span").textContent = autoplay ? "停止播放" : "全部播放";
  b.querySelector("svg").innerHTML = autoplay ? '<path d="M7 7h10v10H7z"/>' : '<path d="M7 5v14l11-7z"/>';
}
function stopAll() {
  if (!autoplay) return;
  autoplay = null;
  if (synth) synth.cancel();
  updatePlayAll();
}
function playAll() {
  if (autoplay) { stopAll(); return; }
  const els = Array.from(document.querySelectorAll("#list .item, #list .cell")).filter((el) => el.offsetParent !== null);
  if (!els.length) return;
  const token = autoplay = {};
  updatePlayAll();
  let i = 0;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step = () => {
    if (autoplay !== token) return;
    if (i >= els.length) { stopAll(); return; }
    const el = els[i++];
    el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    speak(el._say, el, () => { if (autoplay === token) setTimeout(step, 450); });
  };
  step();
}
$("play-all").addEventListener("click", playAll);

function setShowExtra(on) {
  showExtra = on;
  store.set("extra", on ? "on" : "off");
}
$("show-extra").addEventListener("change", (e) => {
  setShowExtra(e.target.checked);
  stopAll();
  render(location.hash.slice(1));
});

function setMode(m) {
  mode = m;
  store.set("mode", m);
  document.querySelectorAll("#mode button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  $("list").dataset.mode = m;
  $("mode-hint").hidden = m === "both";
  $("mode-hint").textContent = MODE_HINT[m] || "";
  // 換模式時全部重新蓋上
  document.querySelectorAll("#list .item, #list .cell").forEach((el) => el.classList.add("masked"));
  updateRevealAll();
}
function updateRevealAll() {
  const btn = $("reveal-all");
  btn.hidden = mode === "both";
  btn.textContent = document.querySelector("#list .masked") ? "全部翻開" : "全部蓋上";
}
document.querySelectorAll("#mode button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
$("reveal-all").addEventListener("click", () => {
  const anyMasked = !!document.querySelector("#list .masked");
  document.querySelectorAll("#list .item, #list .cell").forEach((el) => el.classList.toggle("masked", !anyMasked));
  updateRevealAll();
});

function renderUnit(idx) {
  const unit = currentUnit = UNITS[idx];
  $("unit").value = unit.id;
  $("unit-title").textContent = unit.title;
  const list = $("list");
  list.innerHTML = "";
  if (unit.sections) {
    list.className = "kana";
    let n = 0;
    unit.sections.forEach((sec) => {
      const h = document.createElement("h3");
      h.textContent = sec.label;
      list.appendChild(h);
      const g = document.createElement("div");
      g.className = "grid " + sec.kind;
      sec.cells.forEach((c) => {
        if (!c) { const e = document.createElement("span"); e.className = "gap"; g.appendChild(e); return; }
        n++;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "cell masked";
        // 五十音：大字是日文；數字：大字是數字（當作中文那一面）
        const bigPart = unit.grid === "numbers" ? "zh-part" : "ja-part";
        const smallPart = unit.grid === "numbers" ? "ja-part" : "zh-part";
        b.innerHTML = '<span class="k ' + bigPart + '">' + esc(c.big) + '</span><span class="r ' + smallPart + '">' + (unit.grid === "numbers" ? markLong(esc(c.small)) : esc(c.small)) + "</span>";
        b.setAttribute("aria-label", "播放：" + c.big + "（" + c.small + "）");
        b._say = c.say;
        b.addEventListener("click", () => tapCell(b, c.say));
        g.appendChild(b);
      });
      list.appendChild(g);
    });
    $("unit-count").textContent = n + " 個";
  } else {
    list.className = "list";
    const items = visibleItems(unit);
    $("unit-count").textContent = items.length + " 句";
    if (!items.length) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "這個單元沒有符合目前熟練度的內容。可以在上面多選幾種熟練度。";
      list.appendChild(empty);
    }
    items.forEach((it) => list.appendChild(itemRow(it, unit, true)));
  }
  $("unit-eyebrow").textContent = "單元 " + (idx + 1) + " / " + UNITS.length + "・" + $("unit-count").textContent;
  $("prev").disabled = idx === 0;
  $("next").disabled = idx === UNITS.length - 1;
  $("prev-name").textContent = idx > 0 ? UNITS[idx - 1].title : "";
  $("next-name").textContent = idx < UNITS.length - 1 ? UNITS[idx + 1].title : "";
  $("prev").onclick = () => go(UNITS[idx - 1].id);
  $("next").onclick = () => go(UNITS[idx + 1].id);
  store.set("unit", unit.id);
  $("cho-legend").hidden = unit.grid === "kana";
  $("extra-switch").hidden = !(unit.items || []).some((it) => it.extra);
  $("show-extra").checked = showExtra;
  $("lvbar").hidden = !unit.items;
  $("learn-tip").textContent = unit.items
    ? "點文字看詳細和例句，點喇叭只播放，點彩色標籤切換熟練度。沒有聲音的話，請確認手機沒有開靜音。"
    : "點一格就會念出來。沒有聲音的話，請確認手機沒有開靜音。";
  updateLvFilter();
  setMode(mode);
}

// ---- 考試 ----
const TYPES = [["mix", "混合"], ["ja2zh", "看日文選答案"], ["zh2ja", "看中文選日文"], ["listen", "聽音選日文"]];
const COUNTS = [10, 20, 30, 50];
const quiz = {
  units: new Set((store.get("quizUnits") || "").split(",").filter((id) => UNITS.some((u) => u.id === id))),
  type: store.get("quizType") || "mix",
  count: parseInt(store.get("quizCount"), 10) || 10,
  qs: [], i: 0, right: [], wrong: [],
};
if (!quiz.units.size) quiz.units.add("kana");

function seg(options, current, onPick) {
  const wrap = document.createElement("div");
  wrap.className = "seg";
  options.forEach(([val, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(val === current));
    b.addEventListener("click", () => { onPick(val); renderSetup(); });
    wrap.appendChild(b);
  });
  return wrap;
}
function saveQuiz() {
  store.set("quizUnits", Array.from(quiz.units).join(","));
  store.set("quizType", quiz.type);
  store.set("quizCount", String(quiz.count));
}

function renderSetup() {
  saveQuiz();
  const box = $("quiz");
  box.innerHTML =
    '<div class="unit-head"><h2>出考卷</h2></div>' +
    '<section class="panel"><div class="panel-head"><h3>範圍</h3>' +
      '<span class="links"><button type="button" class="link" id="q-all">全選</button><button type="button" class="link" id="q-none">清除</button></span></div>' +
      '<div class="checks" id="q-units"></div>' +
      '<label class="check extra-check" for="q-extra"><input type="checkbox" id="q-extra"' + (showExtra ? " checked" : "") + '><span class="check-name">包含「補充」的單字和句子</span></label></section>' +
    '<section class="panel"><h3>熟練度</h3><div id="q-lv"></div><p class="hint">只套用在單字和句子；五十音和數字不分熟練度。</p></section>' +
    '<section class="panel"><h3>題型</h3><div id="q-type"></div></section>' +
    '<section class="panel"><h3>題數</h3><div id="q-count"></div></section>' +
    '<button type="button" class="primary" id="q-start">開始考試</button>';
  const checks = $("q-units");
  let total = 0;
  const lvCounts = [0, 0, 0];
  UNITS.forEach((u) => {
    const id = "q-u-" + u.id;
    const n = poolOf(u).length;
    if (quiz.units.has(u.id)) {
      total += n;
      if (u.items) u.items.filter(passExtra).forEach((it) => { lvCounts[getLv(keyOf(u, it))]++; });
    }
    const lab = document.createElement("label");
    lab.className = "check";
    lab.setAttribute("for", id);
    lab.innerHTML = '<input type="checkbox" id="' + id + '"' + (quiz.units.has(u.id) ? " checked" : "") + ">" +
      '<span class="check-name">' + esc(u.title) + '</span><span class="count">' + n + "</span>";
    lab.querySelector("input").addEventListener("change", (e) => {
      if (e.target.checked) quiz.units.add(u.id); else quiz.units.delete(u.id);
      renderSetup();
    });
    checks.appendChild(lab);
  });
  $("q-lv").appendChild(lvChips(lvCounts, renderSetup));
  $("q-extra").addEventListener("change", (e) => { setShowExtra(e.target.checked); renderSetup(); });
  $("q-all").onclick = () => { UNITS.forEach((u) => quiz.units.add(u.id)); renderSetup(); };
  $("q-none").onclick = () => { quiz.units.clear(); renderSetup(); };
  $("q-type").appendChild(seg(TYPES, quiz.type, (v) => { quiz.type = v; }));
  $("q-count").appendChild(seg(COUNTS.map((n) => [n, n + " 題"]), quiz.count, (v) => { quiz.count = v; }));
  const start = $("q-start");
  start.disabled = total === 0;
  if (quiz.units.size === 0) start.textContent = "請先勾選範圍";
  else if (total === 0) start.textContent = "沒有符合條件的題目";
  else if (total < quiz.count) start.textContent = "開始考試（共 " + total + " 題）";
  start.onclick = startQuiz;
}

function makeQuestions() {
  const chosen = UNITS.filter((u) => quiz.units.has(u.id));
  const all = chosen.flatMap((u) => poolOf(u));
  return shuffle(all).slice(0, quiz.count).map((q) => {
    const type = quiz.type === "mix" ? ["ja2zh", "zh2ja", "listen"][Math.floor(Math.random() * 3)] : quiz.type;
    const field = type === "ja2zh" ? "zh" : "ja";
    const seen = new Set([q[field]]);
    const opts = [q];
    // 錯誤選項：先從同一個單元挑，不夠再放寬（不管熟練度、補充），最後才用其他單元
    const sources = [shuffle(poolOf(q.unit)), shuffle(poolOf(q.unit, true)), shuffle(all)];
    for (const src of sources) {
      for (const p of src) {
        if (opts.length >= 4) break;
        if (seen.has(p[field])) continue;
        seen.add(p[field]);
        opts.push(p);
      }
    }
    return { q, type, field, opts: shuffle(opts) };
  });
}

function startQuiz() {
  quiz.qs = makeQuestions();
  quiz.i = 0; quiz.right = []; quiz.wrong = [];
  renderQuestion();
}

function renderQuestion() {
  const box = $("quiz");
  const { q, type, field, opts } = quiz.qs[quiz.i];
  const total = quiz.qs.length;
  let prompt = "";
  if (type === "ja2zh") {
    prompt = '<div class="q-ja' + (q.ja.includes("\n") ? " long" : "") + '">' + jaHTML(q.ja) + "</div>" +
      (q.sub ? '<div class="kanji">' + esc(q.sub) + "</div>" : "") +
      '<button type="button" class="mini-play" id="q-say" aria-label="聽發音">' + PLAY_ICON + "</button>";
  } else if (type === "zh2ja") {
    prompt = '<div class="q-zh">' + esc(q.zh) + "</div>";
  } else {
    prompt = '<button type="button" class="big-play" id="q-say" aria-label="再聽一次">' + PLAY_ICON + "</button>" +
      '<div class="count">點喇叭可以再聽一次</div>';
  }
  box.innerHTML =
    '<div class="unit-head"><h2>第 ' + (quiz.i + 1) + " / " + total + ' 題</h2><span class="count">答對 ' + quiz.right.length + "</span></div>" +
    '<div class="bar"><span style="width:' + (quiz.i / total * 100) + '%"></span></div>' +
    '<section class="prompt"><div class="ask">' + esc(askOf(q.unit, type)) + "</div>" + prompt + "</section>" +
    '<div class="opts" id="q-opts"></div>' +
    '<div class="feedback" id="q-fb" hidden></div>' +
    '<button type="button" class="ghost" id="q-quit">結束考試</button>' +
    (quiz.i === 0 ? '<p class="hint kb-hint">有鍵盤的話：按 <kbd>1</kbd>～<kbd>4</kbd> 作答，<kbd>Enter</kbd> 下一題，<kbd>空白鍵</kbd> 再聽一次。</p>' : "");
  if ($("q-say")) $("q-say").onclick = (e) => speak(q.say, e.currentTarget);
  const wrap = $("q-opts");
  const btns = new Map();
  opts.forEach((o) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (field === "ja" ? " ja-opt" : "");
    b.innerHTML = field === "ja" ? jaHTML(o.ja) : esc(o.zh);
    b.dataset.n = wrap.children.length + 1;
    b.addEventListener("click", () => answer(o, b, btns));
    wrap.appendChild(b);
    btns.set(o, b);
  });
  $("q-quit").onclick = showResult;
  if (type === "listen") speak(q.say, $("q-say"));
}

function answer(o, btn, btns) {
  const { q } = quiz.qs[quiz.i];
  btns.forEach((b) => { b.disabled = true; });
  const ok = o === q;
  (ok ? quiz.right : quiz.wrong).push(q);
  btns.get(q).classList.add("right");
  if (!ok) btn.classList.add("wrong");
  const last = quiz.i === quiz.qs.length - 1;
  const token = quiz.token = {};
  // 答對：念完正確答案後自動下一題；答錯：停下來讓你看清楚
  speak(q.say, null, () => {
    if (ok && quiz.token === token && !$("quiz").hidden && $("q-next")) setTimeout(() => {
      if (quiz.token === token && $("q-next")) $("q-next").click();
    }, 350);
  });
  const fb = $("q-fb");
  fb.className = "feedback " + (ok ? "ok" : "bad");
  fb.innerHTML = '<span class="fb-text">' + (ok ? "答對了！馬上下一題…" : "答錯了，正確答案已標成綠色") + "</span>" +
    '<button type="button" class="primary" id="q-next">' + (last ? "看成績" : "下一題") + "</button>";
  fb.hidden = false;
  $("q-next").onclick = () => {
    quiz.token = null;
    if (last) return showResult();
    quiz.i++;
    renderQuestion();
    window.scrollTo(0, 0);
  };
  $("q-next").focus({ preventScroll: true });
  fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function showResult() {
  quiz.token = null;
  if (synth) synth.cancel();
  const done = quiz.wrong.length + quiz.right.length;
  const total = quiz.qs.length;
  const pct = done ? Math.round(quiz.right.length / done * 100) : 0;
  // 只有單字、句子有熟練度
  const keyed = (arr) => arr.filter((x) => x.item).map((x) => keyOf(x.unit, x.item));
  const wrongUp = keyed(quiz.wrong).filter((k) => getLv(k) > 0);
  const rightUp = keyed(quiz.right).filter((k) => getLv(k) < 2);
  const box = $("quiz");
  box.innerHTML =
    '<div class="unit-head"><h2>成績</h2></div>' +
    '<section class="prompt"><div class="score">' + quiz.right.length + '<small> / ' + done + "</small></div>" +
    '<div class="count">' + (done < total ? "（共 " + total + " 題，做了 " + done + " 題）" : "答對率 " + pct + "%") + "</div></section>" +
    (wrongUp.length || rightUp.length ? '<section class="panel"><h3>更新熟練度</h3><div class="row" id="q-lvup"></div></section>' : "") +
    (quiz.wrong.length ? '<h3 class="sub-h">答錯的題目</h3><p class="hint">點文字看詳細，點喇叭聽發音。</p><div class="list" id="q-wrong"></div>' : "") +
    '<div class="row"><button type="button" class="primary" id="q-again">再考一次</button>' +
    '<button type="button" class="ghost" id="q-setup">重新選範圍</button></div>';
  const addLvBtn = (keys, label, to) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ghost";
    b.textContent = label;
    b.addEventListener("click", () => {
      keys.forEach((k) => setLv(k, to(getLv(k))));
      b.disabled = true;
      b.textContent = "已更新 " + keys.length + " 個";
    });
    $("q-lvup").appendChild(b);
  };
  if (rightUp.length) addLvBtn(rightUp, "答對的 " + rightUp.length + " 個升一級", (v) => Math.min(2, v + 1));
  if (wrongUp.length) addLvBtn(wrongUp, "答錯的 " + wrongUp.length + " 個改回「不熟」", () => 0);
  quiz.wrong.forEach((w) => {
    $("q-wrong").appendChild(w.item ? itemRow(w.item, w.unit, false) : itemRow({ ja: w.ja, kanji: w.sub, zh: w.zh, say: w.say }, null, false));
  });
  $("q-again").onclick = () => { startQuiz(); window.scrollTo(0, 0); };
  $("q-setup").onclick = () => { renderSetup(); window.scrollTo(0, 0); };
}

// ---- 切換畫面 ----
function render(hash) {
  closeDetail();
  stopAll();
  if (synth) synth.cancel();
  quiz.token = null;
  const isQuiz = hash === "quiz";
  $("learn").hidden = isQuiz;
  $("quiz").hidden = !isQuiz;
  $("unit").hidden = isQuiz;
  $("tab-learn").setAttribute("aria-pressed", String(!isQuiz));
  $("tab-quiz").setAttribute("aria-pressed", String(isQuiz));
  if (isQuiz) { renderSetup(); return; }
  let idx = UNITS.findIndex((u) => u.id === hash);
  if (idx < 0) idx = Math.max(0, UNITS.findIndex((u) => u.id === store.get("unit")));
  renderUnit(idx);
}
function go(id) {
  if (location.hash.slice(1) === id) render(id);
  else location.hash = id;
  window.scrollTo(0, 0);
}
$("unit").addEventListener("change", (e) => go(e.target.value));
$("tab-learn").addEventListener("click", () => go(store.get("unit") || UNITS[0].id));
$("tab-quiz").addEventListener("click", () => go("quiz"));
window.addEventListener("hashchange", () => render(location.hash.slice(1)));
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("detail").hidden) {
    if (e.key === "Escape") { e.preventDefault(); closeDetail(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); navDetail(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); navDetail(1); }
    return;
  }
  if ($("quiz").hidden) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select") return;
  const opt = document.querySelector('.opt[data-n="' + e.key + '"]');
  if (opt && !opt.disabled) { e.preventDefault(); opt.click(); return; }
  if (e.key === "Enter" && $("q-next")) { e.preventDefault(); $("q-next").click(); return; }
  if (e.key === " " && $("q-say") && tag !== "button") { e.preventDefault(); $("q-say").click(); }
});

// 語速
function setRate(r) {
  rate = r;
  store.set("rate", String(r));
  document.querySelectorAll(".speed button").forEach((b) => {
    b.setAttribute("aria-pressed", String(parseFloat(b.dataset.rate) === r));
  });
}
document.querySelectorAll(".speed button").forEach((b) => {
  b.addEventListener("click", () => setRate(parseFloat(b.dataset.rate)));
});
setRate(rate);

render(location.hash.slice(1));
</script>
